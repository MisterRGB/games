<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>RIFTBOUND — flick · burn · hold the line</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🃏</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500;700;900&family=Alegreya+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#0b0817}
body{font-family:'Alegreya Sans',system-ui,sans-serif;color:#f3e9d8;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
#cv{position:fixed;top:0;left:0;width:100%;height:100%;display:block;touch-action:none}
#vig{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:5;background:radial-gradient(130% 100% at 50% 32%,transparent 55%,rgba(5,3,12,.62) 100%)}
.ctl{position:fixed;right:10px;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,200,87,.35);background:rgba(18,10,36,.65);color:#ffd9a0;display:flex;align-items:center;justify-content:center;z-index:20;cursor:pointer;transition:transform .15s,opacity .3s;touch-action:manipulation}
.ctl:active{transform:scale(.88)}
.ctl.dim{opacity:.25;pointer-events:none}
#btnMute{top:64px}#btnPause{top:110px}
.ctl svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
#btnMute .sl{display:none}
#btnMute.off .wv{display:none}
#btnMute.off .sl{display:block}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="vig"></div>

<button id="btnMute" class="ctl" aria-label="sound">
<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" stroke="none"/><path class="wv" d="M16 9c1.6 1.6 1.6 4.4 0 6"/><path class="sl" d="M4 4l16 16"/></svg>
</button>
<button id="btnPause" class="ctl dim" aria-label="pause">
<svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg>
</button>

<script>
'use strict';
/* ================= helpers ================= */
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const pick=a=>a[(Math.random()*a.length)|0];
const now=()=>AU.ready?AU.ctx.currentTime:0;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function easeOutBack(t){const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);}
function rgba(hex,a){const n=parseInt(hex.slice(1),16);return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+a+')';}
function roman(n){const R=[[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];let s='';for(const p of R){while(n>=p[0]){s+=p[1];n-=p[0];}}return s||'I';}
function vib(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}

/* ================= canvas ================= */
const cv=document.getElementById('cv');
let ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,safeB=0,CW=70,CH=100,riftY=70,handY=500,sanctumY=430;
const GRAV=760;
const safeEl=document.createElement('div');
safeEl.style.cssText='position:fixed;left:0;bottom:0;width:1px;height:env(safe-area-inset-bottom);visibility:hidden';
document.body.appendChild(safeEl);
let STARS=[];
function makeStars(){STARS=[];for(let i=0;i<70;i++)STARS.push({x:Math.random(),y:Math.random()*.75,s:rand(.4,1.5),p:rand(TAU),v:rand(.4,1.6)});}
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  const vv=window.visualViewport;
  W=Math.max(1,Math.round(vv?vv.width:window.innerWidth));
  H=Math.max(1,Math.round(vv?vv.height:window.innerHeight));
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  cv.style.width=W+'px';
  cv.style.height=H+'px';
  cv.style.top=(vv?vv.offsetTop:0)+'px';
  cv.style.left=(vv?vv.offsetLeft:0)+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  safeB=safeEl.offsetHeight||0;
  riftY=Math.max(60,H*.10);
  handY=H-Math.max(96,safeB+96);
  sanctumY=handY-62;
  CW=clamp(W*.17,58,86);CH=CW*1.42;
  makeStars();
  for(const m of MON){m.x=clamp(m.x,24,W-24);m.homeX=clamp(m.homeX,24,W-24);}
  buildDraftLayout();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,120));
if(window.visualViewport)window.visualViewport.addEventListener('resize',resize);
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect){ctx.roundRect(x,y,w,h,r);}else{ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}}

/* ================= glow sprites ================= */
const GLOWS={};
function makeGlowSprite(c){const s=document.createElement('canvas');s.width=s.height=128;const x=s.getContext('2d');const g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,rgba(c,.85));g.addColorStop(.35,rgba(c,.32));g.addColorStop(1,rgba(c,0));x.fillStyle=g;x.fillRect(0,0,128,128);return s;}
function glow(c,x,y,r,a){let g=GLOWS[c];if(!g){g=makeGlowSprite(c);GLOWS[c]=g;}ctx.globalCompositeOperation='lighter';ctx.globalAlpha=a;ctx.drawImage(g,x-r,y-r,r*2,r*2);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';}

/* ================= audio ================= */
const AU={ctx:null,master:null,fx:null,music:null,delay:null,send:null,noise:null,muted:false,ready:false};
try{AU.muted=localStorage.getItem('riftbound.mute')==='1';}catch(e){}
function audioInit(){
  if(AU.ready)return;
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  const c=AU.ctx=new C();
  AU.master=c.createGain();AU.master.gain.value=AU.muted?0:.9;
  const comp=c.createDynamicsCompressor();
  AU.master.connect(comp);comp.connect(c.destination);
  AU.fx=c.createGain();AU.fx.connect(AU.master);
  AU.music=c.createGain();AU.music.gain.value=.5;AU.music.connect(AU.master);
  AU.delay=c.createDelay(.8);AU.delay.delayTime.value=.27;
  const fb=c.createGain();fb.gain.value=.32;AU.delay.connect(fb);fb.connect(AU.delay);
  const wet=c.createGain();wet.gain.value=.45;AU.delay.connect(wet);wet.connect(AU.master);
  AU.send=c.createGain();AU.send.connect(AU.delay);
  const nb=c.createBuffer(1,c.sampleRate,c.sampleRate);
  const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  AU.noise=nb;
  AU.ready=true;musNext=c.currentTime+.1;
}
function env(g,t,a,p,d){g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(p,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d);}
function tone(o){
  if(!AU.ready)return;const c=AU.ctx,t=o.t===undefined?c.currentTime:o.t;
  const os=c.createOscillator(),g=c.createGain();
  os.type=o.type||'sine';os.frequency.setValueAtTime(Math.max(1,o.f),t);
  if(o.f2)os.frequency.exponentialRampToValueAtTime(Math.max(1,o.f2),t+(o.dur||.2));
  env(g,t,o.a||.005,o.vol||.2,o.dur||.2);
  os.connect(g);g.connect(o.dest||AU.fx);if(o.send)g.connect(AU.send);
  os.start(t);os.stop(t+(o.dur||.2)+.12);
}
function noiz(o){
  if(!AU.ready)return;const c=AU.ctx,t=o.t===undefined?c.currentTime:o.t;
  const s=c.createBufferSource();s.buffer=AU.noise;s.loop=true;
  const f=c.createBiquadFilter();f.type=o.type||'bandpass';f.frequency.setValueAtTime(o.f||800,t);
  if(o.f2)f.frequency.exponentialRampToValueAtTime(Math.max(20,o.f2),t+o.dur);
  f.Q.value=o.q||1;
  const g=c.createGain();env(g,t,.005,o.vol||.2,o.dur||.2);
  s.connect(f);f.connect(g);g.connect(o.dest||AU.fx);
  s.start(t);s.stop(t+(o.dur||.2)+.06);
}
const SFX={
  flick(){noiz({dur:.16,vol:.15,f:500,f2:2200,q:1.4});},
  hit(el){const p={slash:340,ember:240,frost:560,bolt:640,nova:200,leech:300,aegis:430,tempest:600,dark:160,begin:400,rise:400}[el]||300;
    tone({type:'square',f:p*rand(.92,1.08),f2:p*.6,dur:.09,vol:.13});noiz({dur:.06,vol:.1,f:1800,q:2,type:'highpass'});},
  kill(cb){const n=[0,3,5,7,10,12,15,17,19][clamp(cb,0,8)];const f=293.66*Math.pow(2,n/12);
    tone({type:'sine',f:520,f2:90,dur:.12,vol:.24});
    tone({type:'triangle',f:f,dur:.35,vol:.2,send:1,a:.01});
    tone({type:'triangle',f:f*1.5,dur:.3,vol:.09,t:now()+.06,send:1});},
  zap(){tone({type:'sawtooth',f:1400,f2:180,dur:.08,vol:.11});noiz({dur:.07,vol:.09,f:3200,q:3,type:'highpass'});},
  nova(){noiz({dur:.45,vol:.28,f:900,f2:80,type:'lowpass'});tone({type:'sine',f:160,f2:40,dur:.5,vol:.28});},
  freeze(){tone({type:'sine',f:1600,f2:520,dur:.25,vol:.13});[0,.06,.12].forEach((d,i)=>tone({type:'sine',f:1200+i*300,dur:.12,vol:.06,t:now()+d}));},
  shield(){tone({type:'triangle',f:660,dur:.3,vol:.14,send:1});tone({type:'triangle',f:990,dur:.4,vol:.11,t:now()+.08,send:1});},
  breach(){tone({type:'sawtooth',f:80,f2:38,dur:.5,vol:.38});noiz({dur:.4,vol:.28,f:300,f2:60,type:'lowpass'});},
  miss(){noiz({dur:.18,vol:.06,f:420,f2:120});},
  heal(){tone({type:'triangle',f:523,dur:.25,vol:.15,send:1});tone({type:'triangle',f:784,dur:.35,vol:.13,t:now()+.1,send:1});},
  draft(i){tone({type:'triangle',f:392*Math.pow(2,i/6),dur:.25,vol:.15,send:1});},
  horn(){tone({type:'sawtooth',f:98,f2:78,dur:.5,vol:.15});tone({type:'sine',f:196,dur:.35,vol:.09,t:now()+.05,send:1});noiz({dur:.25,vol:.1,f:180,f2:60,type:'lowpass'});},
  wave(){[293.66,392,440,587.33].forEach((f,i)=>tone({type:'triangle',f:f,dur:.3,vol:.14,t:now()+i*.09,send:1}));},
  over(){[220,174.6,146.8].forEach((f,i)=>tone({type:'triangle',f:f,dur:.75,vol:.18,t:now()+i*.3,send:1}));},
  ui(){tone({type:'triangle',f:740,dur:.08,vol:.09});}
};
let musNext=0,musStep=0;
const PROG=[73.42,58.27,87.31,65.41];
const PENT=[293.66,349.23,392,440,523.25];
function musicTick(){
  if(!AU.ready)return;
  const c=AU.ctx;
  if(AU.muted||paused){musNext=c.currentTime+.1;return;}
  const bpm=state===ST.PLAY?Math.min(132,90+G.wave*3):(state===ST.DRAFT?84:66);
  const spb=60/bpm;
  while(musNext<c.currentTime+.15){
    const t=musNext,s=musStep,bar=((s/8)|0)%4;
    if(s%8===0){
      tone({type:'triangle',f:PROG[bar],dur:spb*3.4,vol:.15,t:t,dest:AU.music});
      if(state===ST.PLAY){tone({type:'sine',f:120,f2:42,dur:.13,vol:.16,t:t,dest:AU.music});}
    }
    if(s%8===4)tone({type:'triangle',f:PROG[bar]*1.5,dur:spb*1.6,vol:.06,t:t,dest:AU.music});
    if(state===ST.PLAY&&G.combo>=4&&s%2===1&&Math.random()<.5)noiz({dur:.04,vol:.04,f:6500,q:1,type:'highpass',t:t,dest:AU.music});
    const fever=G.combo>=4;
    const p=(state===ST.PLAY?.3:.12)+(fever?.25:0);
    if(Math.random()<p){
      const f=pick(PENT)*(fever&&Math.random()<.5?2:1);
      tone({type:'triangle',f:f,dur:.22,vol:.05+(fever?.02:0),t:t,dest:AU.music,send:1});
    }
    musNext+=spb/2;musStep++;
  }
}

/* ================= state ================= */
const ST={TITLE:0,PLAY:1,DRAFT:2,OVER:3};
let state=ST.TITLE,paused=false,tGlobal=0;
const G={score:0,wave:1,hearts:3,maxHearts:3,shield:0,combo:0,comboT:0,kills:0,bestCombo:0,
  deck:[],hand:[],discard:[],waveT:0,queue:[],pdTimer:0,spawnFlash:0,hintDone:false,phase:'fight'};
let MON=[],PROJ=[],FT=[],ZAPS=[],EM=[];
let banner=null,shake=0,flashA=0,flashC='#fff',freezeT=0,scorePop=0;
let best={score:0,wave:0};
try{const b=JSON.parse(localStorage.getItem('riftbound.best'));if(b)best=b;}catch(e){}
let overStats=null,metaCard=null,dragC=null,pID=null,samples=[],downInfo=null;
let draftPicks=[],draftForsake=null;

/* ================= particles & fx ================= */
const P=[];
function addP(o){if(P.length>560)P.splice(0,24);P.push(Object.assign({life:0,ttl:.6,vx:0,vy:0,size:3,g:0,dr:0,rot:0,vr:0,kind:'dot'},o));}
function burst(x,y,n,c,sp,kind,size,ttl){
  kind=kind||'dot';size=size||3.2;ttl=ttl||.6;
  for(let i=0;i<n;i++){const a=rand(TAU),s=rand(.2,1)*sp;
    addP({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,ttl:rand(.5,1)*ttl,size:rand(.6,1.3)*size,c:c,kind:kind,g:kind==='shard'?420:60,dr:2.2,vr:rand(-8,8)});}
}
function ring(x,y,c,r0,r1,ttl){addP({x:x,y:y,kind:'ring',c:c,ttl:ttl||.4,size:r0,r1:r1});}
function updP(dt){for(let i=P.length-1;i>=0;i--){const p=P[i];p.life+=dt;if(p.life>=p.ttl){P.splice(i,1);continue;}
  p.vy+=(p.g||0)*dt;if(p.dr){p.vx-=p.vx*p.dr*dt;p.vy-=p.vy*p.dr*dt;}
  p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;}}
function drawParticles(){
  ctx.globalCompositeOperation='lighter';
  for(const p of P){const k=1-p.life/p.ttl;
    if(p.kind==='ring'){ctx.strokeStyle=p.c;ctx.globalAlpha=k*.8;ctx.lineWidth=2+4*k;ctx.beginPath();ctx.arc(p.x,p.y,lerp(p.size,p.r1||60,easeOutBack(Math.min(1,p.life/p.ttl))),0,TAU);ctx.stroke();}
    else if(p.kind==='shard'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.globalAlpha=k;const s=p.size;ctx.beginPath();ctx.moveTo(-s,0);ctx.lineTo(0,-s*1.6);ctx.lineTo(s,0);ctx.lineTo(0,s*.7);ctx.closePath();ctx.fill();ctx.restore();}
    else if(p.kind==='spark'){ctx.strokeStyle=p.c;ctx.globalAlpha=k;ctx.lineWidth=Math.max(1,p.size*.7);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*.03,p.y-p.vy*.03);ctx.stroke();}
    else{ctx.fillStyle=p.c;ctx.globalAlpha=k*.9;ctx.beginPath();ctx.arc(p.x,p.y,Math.max(.4,p.size*(.5+.5*k)),0,TAU);ctx.fill();}
  }
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
}
function float(x,y,txt,c,size,disp){FT.push({x:x,y:y,txt:txt,c:c||'#fff',size:size||16,t:0,disp:!!disp});}
function makeZap(x1,y1,x2,y2,c){const pts=[{x:x1,y:y1}];for(let i=1;i<6;i++){const t=i/6;pts.push({x:lerp(x1,x2,t)+rand(-13,13),y:lerp(y1,y2,t)+rand(-13,13)});}pts.push({x:x2,y:y2});return{pts:pts,c:c,t:0,ttl:.18};}
function addShake(v){shake=Math.min(24,shake+v);}
function flash(c,a){flashC=c;flashA=Math.max(flashA,a);}
function hitstop(t){freezeT=Math.max(freezeT,t);}
function showBanner(txt,sub,dur,c){banner={txt:txt,sub:sub,t:0,dur:dur||1.8,c:c||'#ffc857'};}

/* ================= cards ================= */
const EL={slash:{c:'#dfe6ff'},ember:{c:'#ff8a3d'},frost:{c:'#7fd8ff'},bolt:{c:'#ffe45e'},nova:{c:'#ff5c8a'},leech:{c:'#7dff9e'},aegis:{c:'#5ee6b8'},tempest:{c:'#b57bff'},dark:{c:'#ff4d4d'},begin:{c:'#ffc857'},rise:{c:'#ff8a3d'}};
const ELC=el=>(EL[el]||EL.slash).c;
const CARDS={
  slash:{n:'Slash',el:'slash',r:1,dmg:3,d:'Deals 3 damage.'},
  ember:{n:'Ember',el:'ember',r:1,dmg:2,burn:[2,1],d:'2 dmg · burns the foe for 2.'},
  frost:{n:'Frost',el:'frost',r:1,dmg:1,frz:1.7,d:'1 dmg · freezes the foe 1.7s.'},
  bolt:{n:'Bolt',el:'bolt',r:1,dmg:2,pierce:1,d:'2 dmg · pierces through every foe.'},
  leech:{n:'Leech',el:'leech',r:1,dmg:2,heal:1,d:'2 dmg · mends a heart if it slays.'},
  aegis:{n:'Aegis',el:'aegis',r:1,shield:1,d:'Wards the sanctum against one breach.'},
  cleave:{n:'Cleave',el:'slash',r:2,dmg:5,d:'Deals 5 damage.'},
  inferno:{n:'Inferno',el:'ember',r:2,dmg:3,burn:[3,1],d:'3 dmg · burns the foe for 3.'},
  twin:{n:'Twin Fang',el:'slash',r:2,dmg:3,rico:3,d:'3 dmg · ricochets to another foe for 3.'},
  nova:{n:'Nova',el:'nova',r:2,dmg:2,radius:115,d:'Blasts every foe nearby for 2.'},
  bulwark:{n:'Bulwark',el:'aegis',r:2,shield:2,d:'Wards the sanctum against two breaches.'},
  pyro:{n:'Pyroclasm',el:'ember',r:3,dmg:2,radius:140,burn:[2,1],d:'Blast 2 · sets every foe hit alight.'},
  perma:{n:'Permafrost',el:'frost',r:3,dmg:1,radius:140,frzAll:2.6,d:'Freezes every foe caught in the blast.'},
  tempest:{n:'Tempest',el:'tempest',r:3,dmg:2,chain:3,chainDmg:2,d:'2 dmg · arcs lightning to 3 more foes.'},
  reaper:{n:'Reaper',el:'dark',r:3,dmg:9,heavy:1,d:'Massive 9 dmg. Flies heavy and slow.'},
  begin:{n:'BEGIN',el:'begin',r:2,d:''},
  rise:{n:'RISE AGAIN',el:'rise',r:2,d:''}
};
const STARTER=['slash','slash','slash','slash','bolt','bolt','ember','ember','frost','frost'];
const RC=['','#9fb2c8','#ffc857','#c77dff'];

function drawRune(el,w,h){
  const s=w*.30;
  ctx.save();ctx.translate(0,-h*.10);
  const c=ELC(el);
  ctx.strokeStyle=c;ctx.fillStyle=c;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.shadowColor=c;ctx.shadowBlur=13;
  ctx.lineWidth=Math.max(2.5,s*.22);
  if(el==='slash'){ctx.beginPath();ctx.moveTo(-s*.75,s*.8);ctx.lineTo(s*.75,-s*.8);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-s*.05,-s*.42);ctx.lineTo(s*.42,s*.05);ctx.stroke();
    ctx.beginPath();ctx.arc(-s*.75,s*.8,s*.14,0,TAU);ctx.fill();}
  else if(el==='ember'){ctx.beginPath();ctx.moveTo(0,-s);ctx.bezierCurveTo(s*.95,-s*.15,s*.6,s*.7,0,s);ctx.bezierCurveTo(-s*.6,s*.7,-s*.95,-s*.15,0,-s);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.85)';ctx.beginPath();ctx.moveTo(0,-s*.3);ctx.bezierCurveTo(s*.4,s*.1,s*.25,s*.55,0,s*.7);ctx.bezierCurveTo(-s*.25,s*.55,-s*.4,s*.1,0,-s*.3);ctx.fill();}
  else if(el==='frost'){for(let i=0;i<3;i++){ctx.save();ctx.rotate(i*Math.PI/3);ctx.beginPath();ctx.moveTo(0,-s);ctx.lineTo(0,s);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-s*.28,-s*.55);ctx.lineTo(0,-s*.35);ctx.lineTo(s*.28,-s*.55);ctx.stroke();ctx.restore();}}

function handTarget(i,n){const sp=Math.min(CW*1.3,(W-24)/n);return{x:W/2+(i-(n-1)/2)*sp,y:handY+Math.abs(i-(n-1)/2)*7,a:(i-(n-1)/2)*.1};}
function drawToHand(){
  while(G.hand.length<3){
    if(!G.deck.length){
      if(!G.discard.length)break;
      G.deck=shuffle(G.discard);G.discard=[];
      float(W-60,sanctumY+8,'RESHUFFLE','#b9a8d9',11);
    }
    const id=G.deck.pop(),tg=handTarget(G.hand.length,3);
    G.hand.push({id:id,x:tg.x,y:handY+130,a:0,st:'in'});
  }
}
function updHand(dt){
  const n=G.hand.length;
  for(let i=0;i<n;i++){const c=G.hand[i],tg=handTarget(i,n);
    if(c.st==='drag')continue;
    const k=Math.min(1,dt*11);
    c.x=lerp(c.x,tg.x,k);c.y=lerp(c.y,tg.y,k);c.a=lerp(c.a,tg.a,k);
    if(c.st==='in'&&Math.abs(c.y-tg.y)<3)c.st='idle';
    if(c.st==='ret')c.st='idle';
  }
}
function liveVel(){
  const nw=performance.now(),rec=samples.filter(s=>nw-s.t<110);
  if(rec.length<2)return{x:0,y:0};
  const a=rec[0],b=rec[rec.length-1],d=(b.t-a.t)/1000;
  if(d<=.008)return{x:0,y:0};
  return{x:(b.x-a.x)/d,y:(b.y-a.y)/d};
}
function evPos(e){
  const r=cv.getBoundingClientRect();
  return{x:(e.clientX-r.left)*(W/(r.width||W)),y:(e.clientY-r.top)*(H/(r.height||H))};
}
cv.addEventListener('pointerdown',e=>{
  audioInit();if(AU.ready&&AU.ctx.state==='suspended')AU.ctx.resume();

    }

    return;

      dragC=metaCard;metaCard.st='drag';pID=e.pointerId;samples=[{x:p.x,y:p.y,t:performance.now()}];

        dragC=c;c.st='drag';pID=e.pointerId;samples=[{x:p.x,y:p.y,t:performance.now()}];

      }}

},{passive:false});

function releaseCard(){
  if(!dragC)return;

const MTYPES={
  imp:{hp:2,spd:30,size:15,color:'#ff5c7a',score:10,cost:1},
  wisp:{hp:2,spd:21,size:13,color:'#5ce8ff',score:14,cost:1.4,sine:44},
  splitter:{hp:3,spd:17,size:19,color:'#9dff5c',score:18,cost:2.4},
  warded:{hp:3,shield:2,spd:15,size:17,color:'#ffc857',score:26,cost:3},
  brute:{hp:7,spd:9.5,size:28,color:'#b46bff',score:34,cost:4.2}
};
function buildWave(w){
  const avail=['imp','imp','wisp'];
  if(w>=2)avail.push('splitter');
  if(w>=3)avail.push('warded');
  if(w>=4)avail.push('brute');
  let budget=6+w*3;const list=[];
  while(budget>=1){
    const aff=avail.filter(t=>MTYPES[t].cost<=budget);
    if(!aff.length)break;
    const t=pick(aff);list.push(t);budget-=MTYPES[t].cost;
    if(list.length>14)break;
  }
  if(!list.length)list.push('imp');
  const gap=Math.max(.75,2.3-w*.09);
  let t=0;const q=[];
  for(const ty of shuffle(list)){t+=gap*rand(.6,1.5);q.push({t:t,ty:ty,elite:false});}
  if(w>=5)q.forEach(s=>{if(Math.random()<.13)s.elite=true;});
  if(w%5===0&&q.length){const last=q[q.length-1];last.elite=true;if(w>=5)last.ty='brute';}
  return q;
}
const SUBS=['the rift stirs','embers answer','wisps in the dark','hungering shadows','a champion emerges','the veil thins','cinders rise','no mercy beyond','the deep ones wake','reap and be reaped'];
function startWave(w){

function nearestMonster(x,y,ex){

  for(const m of MON){if(m.dead||(ex&&ex.has(m)))continue;

function damageMonster(m,dmg,def){

  if(m.shield>0){m.shield-=dmg;if(m.shield<0)m.shield=0;m.flash=.15;

  m.hp-=dmg;m.flash=.14;m.squash=1;

function updMon(dt){
  for(const m of MON){
    if(m.dead)continue;
    m.t+=dt;
    m.flash=Math.max(0,m.flash-dt*5);
    m.squash=Math.max(0,m.squash-dt*3.5);
    if(m.t>240){breach(m);continue;}
    if(m.frozen>0)m.frozen-=dt;
    else{
      m.y+=m.spd*dt;
      if(m.sine)m.x=m.homeX+Math.sin(m.t*2.1+m.seed)*m.sine;
      else m.x+=Math.sin(m.t*1.4+m.seed)*5*dt;
      m.x=clamp(m.x,24,W-24);
    }
    if(m.burn){
      if(Math.random()<.5)addP({x:m.x+rand(-m.size*.5,m.size*.5),y:m.y-m.size*.6,vy:rand(-70,-30),vx:rand(-12,12),ttl:.4,size:2.6,c:pick(['#ff8a3d','#ffc857','#ff5c3c']),dr:1});

      if(m.burn.t>=.62){m.burn.t=0;m.burn.n--;burst(m.x,m.y,4,'#ff8a3d',120,'dot',2.2,.4);damageMonster(m,m.burn.dmg,null);if(m.dead)continue;}
      if(m.burn.n<=0)m.burn=null;
    }
    if(m.type==='wisp'&&Math.random()<.25)addP({x:m.x,y:m.y,vx:rand(-8,8),vy:rand(-8,8),ttl:.5,size:2,c:'#5ce8ff',dr:1.5});

function chainLightning(src,count,dmg){
  let cur=src;const seen=new Set([src]);let any=false;
  for(let i=0;i<count;i++){
    const nx=nearestMonster(cur.x,cur.y,seen);
    if(!nx||Math.hypot(nx.x-cur.x,nx.y-cur.y)>300)break;
    ZAPS.push(makeZap(cur.x,cur.y,nx.x,nx.y,'#b57bff'));
    burst(nx.x,nx.y,6,'#b57bff',160,'spark',2.4,.35);
    damageMonster(nx,dmg,CARDS.tempest);
    seen.add(nx);cur=nx;any=true;
  }
  if(any)SFX.zap();
}
function impact(p,m){

    if(d.burn)m.burn={n:d.burn[0],dmg:d.burn[1],t:0};

  }
  if(d.chain)chainLightning(m,d.chain,d.chainDmg||2);
  if(d.rico){
    const nx=nearestMonster(m.x,m.y,new Set([m]));
    if(nx)PROJ.push({id:p.id,def:{n:d.n,el:d.el,dmg:d.rico},x:m.x,y:m.y,vx:0,vy:0,home:nx,hit:new Set([m]),rot:p.rot,vr:22,dead:false,age:0});
  }
}
function updProj(dt){
  for(const p of PROJ){
    if(p.dead)continue;
    p.age+=dt;
    if(p.home){
      if(p.home.dead)p.home=nearestMonster(p.x,p.y,null);
      const sp=920;
      if(p.home){const dx=p.home.x-p.x,dy=p.home.y-p.y,dd=Math.hypot(dx,dy)||1;
        p.vx=lerp(p.vx,dx/dd*sp,Math.min(1,dt*10));p.vy=lerp(p.vy,dy/dd*sp,Math.min(1,dt*10));}
      p.x+=p.vx*dt;p.y+=p.vy*dt;
    }else{
      p.vy+=GRAV*(p.def.heavy?1.55:1)*dt;
      p.x+=p.vx*dt;p.y+=p.vy*dt;
    }
    p.rot+=p.vr*dt;
    if(Math.random()<.6)addP({x:p.x,y:p.y,vx:rand(-14,14),vy:rand(-14,14),ttl:.28,size:2.2,c:ELC(p.def.el),dr:2});
    for(const m of MON){
      if(m.dead||p.hit.has(m))continue;
      if(Math.hypot(m.x-p.x,m.y-p.y)<m.size+15){
        impact(p,m);
        if(!p.def.pierce)p.dead=true;
        p.hit.add(m);
        if(p.dead)break;
      }
    }
    if(!p.dead&&(p.y<-90||p.x<-90||p.x>W+90)){p.dead=true;missShot();}
    else if(!p.dead&&(p.y>H+120||p.age>8)){p.dead=true;}
  }
  PROJ=PROJ.filter(p=>!p.dead);
}

/* ================= run flow ================= */
function initRun(){
  G.score=0;G.hearts=3;G.shield=0;G.combo=0;G.comboT=0;G.kills=0;G.bestCombo=0;
  G.deck=shuffle(STARTER.slice());G.discard=[];G.hand=[];
  MON=[];PROJ=[];G.pdTimer=0;G.hintDone=false;G.phase='fight';
  drawToHand();startWave(1);
}
function doStart(){flash('#ffffff',.28);initRun();state=ST.PLAY;}
function gameOver(){
  state=ST.OVER;SFX.over();vib([80,50,120]);
  burst(W/2,sanctumY,40,'#ff4d5e',420,'dot',3.8,.9);
  flash('#ff3b4d',.4);addShake(20);
  const nb=G.score>best.score&&G.score>0;
  if(nb){best.score=G.score;best.wave=G.wave;try{localStorage.setItem('riftbound.best',JSON.stringify(best));}catch(e){}}
  overStats={score:G.score,wave:G.wave,kills:G.kills,combo:G.bestCombo,nb:nb};
  metaCard={id:'rise',st:'in',x:W/2,y:handY+220,a:0,vx:0,vy:0,rot:0};
}
function updMetaCard(c,dt){
  if(!c)return;
  const home=handTarget(0,1);
  if(c.st==='fly'){
    c.vy+=GRAV*.55*dt;c.x+=c.vx*dt;c.y+=c.vy*dt;c.rot+=9*dt;
    if(Math.random()<.5)addP({x:c.x,y:c.y,vx:rand(-20,20),vy:rand(-20,20),ttl:.3,size:2.4,c:'#ffc857',dr:2});
    if(c.y<H*.42){c.st='in';doStart();}
    else if(c.y>H+160||c.x<-160||c.x>W+160)c.st='ret';
  }else if(c.st==='drag'){/* moved by pointer */}
  else{
    const k=Math.min(1,dt*8);
    c.x=lerp(c.x,home.x,k);c.y=lerp(c.y,home.y+Math.sin(tGlobal*2)*3,k);c.a=lerp(c.a,0,k);
    if(c.st==='ret')c.st='idle';
  }
}

/* ================= draft (canvas-native) ================= */
function totalCards(){return G.deck.length+G.hand.length+G.discard.length;}
function rollDraft(){
  const pool=Object.keys(CARDS).filter(k=>!['slash','begin','rise'].includes(k));
  const wOf=r=>r===1?3:r===2?1.15:.4;
  const bag=pool.slice(),out=[];
  while(out.length<3&&bag.length){
    let tot=0;for(const k of bag)tot+=wOf(CARDS[k].r);
    let x=Math.random()*tot,idx=0;
    for(let i=0;i<bag.length;i++){x-=wOf(CARDS[bag[i]].r);if(x<=0){idx=i;break;}}
    out.push(bag.splice(idx,1)[0]);
  }
  return out;
}
function buildDraftLayout(){
  if(state!==ST.DRAFT||!draftPicks.length)return;
  const ids=draftPicks.map(p=>p.id);
  layoutDraft(ids);
}
function layoutDraft(ids){
  draftPicks=[];
  const cw=Math.min(CW*1.6,(W-56)/3-8);
  const ch=cw*1.42;
  const gap=10;
  const total=ids.length*cw+(ids.length-1)*gap;
  const x0=W/2-total/2+cw/2;
  const cy=Math.max(riftY+ch/2+90,H*.40);
  ids.forEach((id,i)=>{draftPicks.push({id:id,x:x0+i*(cw+gap),y:cy,w:cw,h:ch});});
  draftForsake={x:W/2,y:cy+ch/2+96,w:Math.min(320,W-48),h:44};
}
function openDraft(){
  if(state===ST.DRAFT)return;
  state=ST.DRAFT;
  const ids=rollDraft();
  layoutDraft(ids);
  ids.forEach((id,i)=>SFX.draft(i));
}
function choosePick(id){
  if(state!==ST.DRAFT)return;
  G.deck.push(id);SFX.ui();vib(12);
  const pk=draftPicks.find(k=>k.id===id);
  if(pk){const c=ELC(CARDS[id].el);burst(pk.x,pk.y,18,c,280,'dot',3,.6);ring(pk.x,pk.y,c,8,80,.4);}
  closeDraft();
}
function forsake(){
  if(state!==ST.DRAFT)return;
  if(G.hearts<G.maxHearts){G.hearts++;SFX.heal();}
  else{G.score+=100*(G.wave+1);scorePop=1;}
  SFX.ui();vib(12);
  closeDraft();
}
function closeDraft(){
  draftPicks=[];draftForsake=null;
  state=ST.PLAY;          /* critical: hand control back to the game loop */
  startWave(G.wave+1);
}

/* ================= update ================= */
function update(dt){
  shake=Math.max(0,shake-dt*46);
  flashA=Math.max(0,flashA-dt*2.2);
  scorePop=Math.max(0,scorePop-dt*3);
  G.spawnFlash=Math.max(0,G.spawnFlash-dt*3);
  if(banner){banner.t+=dt;if(banner.t>banner.dur)banner=null;}
  updP(dt);
  for(const f of FT){f.t+=dt;f.y-=26*dt;}
  FT=FT.filter(f=>f.t<1.15);
  for(const z of ZAPS)z.t+=dt;
  ZAPS=ZAPS.filter(z=>z.t<z.ttl);
  emberTick(dt);
  if(state===ST.PLAY){
    if(G.phase==='fight'){
      if(G.comboT>0){G.comboT-=dt;if(G.comboT<=0)G.combo=0;}
      G.waveT+=dt;
      while(G.queue.length&&G.queue[0].t<=G.waveT&&MON.length<12){
        const s=G.queue.shift();spawnMonster(s.ty,null,null,{elite:s.elite});
      }
      if(G.wave>=3&&Math.random()<dt*.6){
        const a=rand(TAU);
        ZAPS.push(makeZap(W/2+Math.cos(a)*30,riftY+Math.sin(a)*12,W/2+Math.cos(a)*rand(60,120),riftY+Math.sin(a)*rand(20,50),'#c77dff'));
      }
      if(!G.queue.length&&!MON.length)waveClear();
    }else if(G.phase==='cleared'){
      G.pdTimer-=dt;
      if(G.pdTimer<=0)openDraft();
    }
    updMon(dt);updProj(dt);updHand(dt);
  }else if(state===ST.TITLE||state===ST.OVER){
    updMetaCard(metaCard,dt);
  }
}
function emberTick(dt){
  const target=Math.min(64,22+G.combo*5+(state===ST.PLAY?6:0));
  while(EM.length<target)EM.push({x:rand(W),y:H+rand(60),v:rand(14,46),s:rand(1,2.8),p:rand(TAU),c:pick(['#ff8a3d','#ffc857','#ff6a3d'])});
  for(let i=EM.length-1;i>=0;i--){const e=EM[i];
    e.y-=e.v*dt;e.x+=Math.sin(tGlobal*1.3+e.p)*12*dt;
    if(e.y<-12){if(EM.length>target)EM.splice(i,1);else{e.y=H+10;e.x=rand(W);}}}
}

function drawRift(){

}
function drawSanctum(){
  const y=sanctumY;
  const g=ctx.createLinearGradient(0,0,W,0);
  g.addColorStop(0,rgba('#5ee6b8',0));g.addColorStop(.2,rgba('#5ee6b8',.65));
  g.addColorStop(.5,rgba('#ffc857',.9));g.addColorStop(.8,rgba('#5ee6b8',.65));g.addColorStop(1,rgba('#5ee6b8',0));

function drawMonster(m){
  const t=tGlobal;
  ctx.save();ctx.translate(m.x,m.y);
  const wob=Math.sin(t*3.2+m.seed)*.05,sq=m.squash;
  ctx.scale(1+wob+sq*.25,1-wob-sq*.25);
  const r=m.size;
  glow(m.color,0,0,r*2.6,.2);
  const path=new Path2D();const N=10;
  for(let i=0;i<=N;i++){const a=i/N*TAU;const r2=r*(1+Math.sin(a*3+t*4.5+m.seed)*.08);
    const x=Math.cos(a)*r2,y=Math.sin(a)*r2*1.05;
    if(i)path.lineTo(x,y);else path.moveTo(x,y);}
  path.closePath();
  ctx.fillStyle=m.color;ctx.fill(path);
  ctx.lineWidth=2;ctx.strokeStyle='rgba(10,5,20,.55)';ctx.stroke(path);
  const hg=ctx.createRadialGradient(-r*.3,-r*.4,1,-r*.3,-r*.4,r*1.1);
  hg.addColorStop(0,'rgba(255,255,255,.4)');hg.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=hg;ctx.fill(path);
  if(m.type==='imp'||m.type==='brute'){
    ctx.fillStyle='rgba(0,0,0,.4)';
    const hs=m.type==='brute'?1.4:1;
    ctx.beginPath();ctx.moveTo(-r*.55,-r*.6);ctx.lineTo(-r*.75*hs,-r*1.15*hs);ctx.lineTo(-r*.25,-r*.8);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(r*.55,-r*.6);ctx.lineTo(r*.75*hs,-r*1.15*hs);ctx.lineTo(r*.25,-r*.8);ctx.closePath();ctx.fill();
  }
  if(m.type==='splitter'){ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-r*.7);ctx.lineTo(0,r*.7);ctx.stroke();}
  const ex=r*.36,ey=-r*.15,er=Math.max(2.4,r*.21);
  const blink=((t*.9+m.seed)%3.4)<.13;
  if(blink){ctx.strokeStyle='#fff';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(-ex-er,ey);ctx.lineTo(-ex+er,ey);ctx.moveTo(ex-er,ey);ctx.lineTo(ex+er,ey);ctx.stroke();}
  else{ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(-ex,ey,er,0,TAU);ctx.fill();
    ctx.beginPath();ctx.arc(ex,ey,er,0,TAU);ctx.fill();
    ctx.fillStyle='#120a20';
    ctx.beginPath();ctx.arc(-ex,ey+er*.3,er*.5,0,TAU);ctx.fill();
    ctx.beginPath();ctx.arc(ex,ey+er*.3,er*.5,0,TAU);ctx.fill();}
  ctx.strokeStyle='rgba(0,0,0,.55)';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(0,r*.35,r*.22,Math.PI*.15,Math.PI*.85);ctx.stroke();
  if(m.elite){ctx.fillStyle='#ffc857';
    for(const dx of[-8,0,8]){ctx.beginPath();ctx.moveTo(dx-4,-r-2);ctx.lineTo(dx,-r-11);ctx.lineTo(dx+4,-r-2);ctx.closePath();ctx.fill();}}
  if(m.flash>0){ctx.fillStyle='rgba(255,255,255,'+Math.min(.9,m.flash*6)+')';ctx.fill(path);}
  if(m.frozen>0){
    ctx.fillStyle='rgba(127,216,255,.4)';ctx.fill(path);
    ctx.strokeStyle='rgba(220,245,255,.85)';ctx.lineWidth=1.5;ctx.stroke(path);
  }
  ctx.restore();
  if(m.shield>0){
    ctx.strokeStyle='#ffc857';ctx.lineWidth=1.5;ctx.setLineDash([5,6]);ctx.lineDashOffset=-t*26;
    ctx.beginPath();ctx.arc(m.x,m.y,r+7,0,TAU);ctx.stroke();ctx.setLineDash([]);
  }
  const bw=Math.max(26,r*2),pct=clamp(m.hp/m.maxhp,0,1);
  ctx.fillStyle='rgba(8,4,16,.6)';rr(m.x-bw/2,m.y-r-13,bw,4,2);ctx.fill();
  ctx.fillStyle=pct>.5?'#7dff9e':pct>.25?'#ffc857':'#ff5c5e';
  if(pct>0){rr(m.x-bw/2,m.y-r-13,bw*pct,4,2);ctx.fill();}
}

function drawSpaced(txt,x,y,sp){
  ctx.save();ctx.textAlign='left';
  const ch=[...txt],ws=ch.map(c=>ctx.measureText(c).width);
  let tot=0;for(const w2 of ws)tot+=w2;tot+=sp*(ch.length-1);
  let cx=x-tot/2;
  for(let i=0;i<ch.length;i++){ctx.fillText(ch[i],cx,y);cx+=ws[i]+sp;}
  ctx.restore();

function wrapTxt(txt,max){
  const words=txt.split(' ');const lines=[];let cur='';
  for(const w2 of words){const t2=cur?cur+' '+w2:w2;
    if(ctx.measureText(t2).width>max&&cur){lines.push(cur);cur=w2;}else cur=t2;}
  if(cur)lines.push(cur);return lines;
}

      let px=dragC.x,py=dragC.y,vx=clamp(v.x,-900,900),vy=clamp(v.y,-2100,-400);
      for(let i=0;i<16;i++){
        vy+=GRAV*.045;px+=vx*.045;py+=vy*.045;
        if(py<-40)break;
        ctx.globalAlpha=(1-i/16)*.5;ctx.fillStyle='#ffd9a0';
        ctx.beginPath();ctx.arc(px,py,3-i*.12,0,TAU);ctx.fill();
      }
      ctx.globalAlpha=1;
    }
  }
}
function drawHint(){
  if(G.hintDone||G.wave!==1)return;
  const t=tGlobal,a=.45+.4*Math.sin(t*4);
  ctx.globalAlpha=a;ctx.strokeStyle='#ffd9a0';ctx.lineWidth=2.5;ctx.lineCap='round';
  for(let i=0;i<3;i++){
    const y=handY-CH*.72-i*15-((t*26)%15);
    ctx.globalAlpha=a*(1-i*.25);
    ctx.beginPath();ctx.moveTo(W/2-11,y+6);ctx.lineTo(W/2,y-4);ctx.lineTo(W/2+11,y+6);ctx.stroke();
  }
  ctx.globalAlpha=a;
  ctx.font="700 12px 'Alegreya Sans',sans-serif";ctx.fillStyle='#ffd9a0';
  drawSpaced('DRAG A CARD \u00b7 FLICK IT UPWARD',W/2,handY-CH*1.28,2);
  ctx.globalAlpha=1;
}
function drawDraft(){
  ctx.fillStyle='rgba(8,4,16,.66)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.font="700 "+Math.min(38,W*.09)+"px 'Grenze Gotisch',serif";
  ctx.fillStyle='#ffd9a0';ctx.shadowColor='rgba(255,140,50,.4)';ctx.shadowBlur=18;
  ctx.fillText('CHOOSE YOUR FATE',W/2,H*.15);ctx.shadowBlur=0;
  ctx.font="500 11px 'Alegreya Sans',sans-serif";ctx.fillStyle='#b9a8d9';
  drawSpaced('BEFORE WAVE '+roman(G.wave+1)+' \u00b7 DECK '+totalCards()+' CARDS',W/2,H*.15+22,2.5);
  const t=tGlobal;
  for(let i=0;i<draftPicks.length;i++){
    const pk=draftPicks[i],d=CARDS[pk.id];
    const bob=Math.sin(t*2+i*1.7)*3;
    if(d.r===2)glow('#ffc857',pk.x,pk.y+bob,pk.w*.95,.15);
    if(d.r===3)glow('#c77dff',pk.x,pk.y+bob,pk.w*.95,.17);
    drawCard(pk.x,pk.y+bob,pk.id,{w:pk.w,h:pk.h});
    ctx.textAlign='center';
    ctx.font="9px 'Alegreya Sans',sans-serif";ctx.fillStyle=RC[d.r]||'#8fa3b8';
    drawSpaced(['','COMMON','RARE','EPIC'][d.r],pk.x,pk.y+bob+pk.h/2+13,2);
    ctx.font="700 17px 'Grenze Gotisch',serif";ctx.fillStyle='#fff';
    ctx.fillText(d.n,pk.x,pk.y+bob+pk.h/2+30);
    ctx.font="500 10.5px 'Alegreya Sans',sans-serif";ctx.fillStyle='#cbbde6';
    const lines=wrapTxt(d.d,pk.w+16);
    for(let li=0;li<lines.length;li++)ctx.fillText(lines[li],pk.x,pk.y+bob+pk.h/2+45+li*13);
  }
  if(draftForsake){
    const f=draftForsake;
    rr(f.x-f.w/2,f.y-f.h/2,f.w,f.h,22);
    ctx.fillStyle='rgba(40,24,66,.92)';ctx.fill();
    ctx.strokeStyle='rgba(255,200,87,.45)';ctx.lineWidth=1.4;ctx.stroke();
    ctx.font="800 12px 'Alegreya Sans',sans-serif";ctx.fillStyle='#ffd9a0';ctx.textAlign='center';
    ctx.fillText(G.hearts<G.maxHearts?'\u27e1 FORSAKE \u2014 MEND A HEART':'\u27e1 FORSAKE \u2014 +'+(100*(G.wave+1))+' SOULS',f.x,f.y+4);
  }
}
function drawPaused(){
  ctx.fillStyle='rgba(8,4,16,.62)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.font="700 42px 'Grenze Gotisch',serif";ctx.fillStyle='#ffd9a0';
  ctx.shadowColor='rgba(255,140,50,.4)';ctx.shadowBlur=16;
  ctx.fillText('PAUSED',W/2,H*.45);ctx.shadowBlur=0;
  ctx.font="500 12px 'Alegreya Sans',sans-serif";ctx.fillStyle='#b9a8d9';
  drawSpaced('TAP TO RESUME',W/2,H*.45+28,3);
}
function drawBanner(){
  if(!banner)return;
  const b=banner;
  const inT=Math.min(1,b.t/.32),outT=clamp((b.t-(b.dur-.4))/.4,0,1);
  const a=Math.max(0,Math.min(inT,1-outT));
  const sc=easeOutBack(inT)*(1-outT*.2);
  ctx.save();ctx.translate(W/2,H*.4);ctx.scale(sc,sc);
  ctx.globalAlpha=a;
  glow(b.c,0,-8,150,.3*a);
  ctx.textAlign='center';
  ctx.font="700 "+Math.min(46,W*.11)+"px 'Grenze Gotisch',serif";
  ctx.fillStyle=b.c;ctx.shadowColor=rgba(b.c,.7);ctx.shadowBlur=22;
  ctx.fillText(b.txt,0,0);ctx.shadowBlur=0;
  if(b.sub){ctx.globalAlpha=a*.85;ctx.font="500 14px 'Alegreya Sans',sans-serif";
    ctx.fillStyle='#e8dfff';drawSpaced(b.sub.toUpperCase(),0,26,3);}
  ctx.restore();
}
function drawTitle(){
  const t=tGlobal;
  glow('#ff8a3d',W/2,H*.26,160,.18+.05*Math.sin(t*2));
  ctx.textAlign='center';
  ctx.font="900 "+Math.min(76,W*.17)+"px 'Grenze Gotisch',serif";
  ctx.fillStyle='#1a0f22';ctx.fillText('RIFTBOUND',W/2+3,H*.27+3);
  ctx.fillStyle='#ffd9a0';ctx.shadowColor='rgba(255,140,50,.55)';ctx.shadowBlur=22;
  ctx.fillText('RIFTBOUND',W/2,H*.27);ctx.shadowBlur=0;
  ctx.font="500 13px 'Alegreya Sans',sans-serif";ctx.fillStyle='#b9a8d9';
  drawSpaced('FLICK \u00b7 BURN \u00b7 HOLD THE LINE',W/2,H*.27+26,3);
  if(best.score>0){ctx.font="700 13px 'Alegreya Sans',sans-serif";ctx.fillStyle='rgba(255,217,160,.75)';
    ctx.fillText('BEST '+best.score.toLocaleString()+' \u00b7 WAVE '+roman(best.wave),W/2,H*.27+50);}
  const a=.55+.35*Math.sin(t*3.5);
  ctx.globalAlpha=a;ctx.font="700 12px 'Alegreya Sans',sans-serif";ctx.fillStyle='#ffd9a0';
  drawSpaced('FLICK THE CARD TO BEGIN',W/2,handY-CH*.72,2.5);
  ctx.globalAlpha=1;
}
function drawOver(){
  const t=tGlobal;
  ctx.fillStyle='rgba(8,4,16,.55)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.font="900 "+Math.min(44,W*.105)+"px 'Grenze Gotisch',serif";
  ctx.fillStyle='#ff5c7a';ctx.shadowColor='rgba(255,60,90,.5)';ctx.shadowBlur=20;
  ctx.fillText('THE RIFT PREVAILS',W/2,H*.19);ctx.shadowBlur=0;
  const pw=Math.min(W-48,340),px=W/2-pw/2,py=H*.25,ph=190;
  rr(px,py,pw,ph,14);ctx.fillStyle='rgba(20,12,38,.88)';ctx.fill();
  ctx.strokeStyle='rgba(255,200,87,.28)';ctx.lineWidth=1;ctx.stroke();
  ctx.font="500 12px 'Alegreya Sans',sans-serif";ctx.fillStyle='#b9a8d9';
  drawSpaced('SOULS GATHERED',W/2,py+32,3);
  ctx.font="900 42px 'Grenze Gotisch',serif";ctx.fillStyle='#ffd9a0';
  ctx.shadowColor='rgba(255,160,60,.5)';ctx.shadowBlur=14;
  ctx.fillText(overStats.score.toLocaleString(),W/2,py+74);ctx.shadowBlur=0;
  ctx.font="700 14px 'Alegreya Sans',sans-serif";ctx.fillStyle='#e8dfff';
  ctx.fillText('WAVES '+roman(overStats.wave)+'    SLAIN '+overStats.kills+'    BEST COMBO \u00d7'+overStats.combo,W/2,py+112);
  if(overStats.nb){
    ctx.globalAlpha=.7+.3*Math.sin(t*5);
    ctx.font="700 17px 'Grenze Gotisch',serif";ctx.fillStyle='#ffc857';
    ctx.fillText('\u2605 NEW RECORD \u2605',W/2,py+150);
    ctx.globalAlpha=1;
  }
  const a=.55+.35*Math.sin(t*3.5);
  ctx.globalAlpha=a;ctx.font="700 12px 'Alegreya Sans',sans-serif";ctx.fillStyle='#ffd9a0';
  drawSpaced('FLICK TO RISE AGAIN',W/2,handY-CH*.72,2.5);
  ctx.globalAlpha=1;
}
function draw(){
  drawBG();
  ctx.save();
  if(shake>0)ctx.translate(rand(-shake,shake)*.5,rand(-shake,shake)*.5);
  drawRift();
  drawSanctum();
  if(state===ST.PLAY||state===ST.DRAFT){
    for(const m of MON)drawMonster(m);
    for(const p of PROJ)drawProj(p);
  }
  drawParticles();
  drawZaps();
  drawFloats();
  ctx.restore();
  if(state===ST.PLAY){drawHand();drawHUD();drawHint();}
  else if(state===ST.DRAFT){drawHUD();drawDraft();}
  else if(state===ST.TITLE){drawTitle();if(metaCard)drawCard(metaCard.x,metaCard.y,metaCard.id,{rot:metaCard.a,lift:metaCard.st==='drag',scale:metaCard.st==='drag'?1.14:1});}
  else if(state===ST.OVER){drawOver();if(metaCard)drawCard(metaCard.x,metaCard.y,metaCard.id,{rot:metaCard.a,lift:metaCard.st==='drag',scale:metaCard.st==='drag'?1.14:1});}
  if(state===ST.PLAY||state===ST.DRAFT)drawBanner();
  if(paused)drawPaused();
  if(flashA>0){ctx.globalAlpha=flashA;ctx.fillStyle=flashC;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  if(G.combo>=4&&state===ST.PLAY){
    ctx.strokeStyle=rgba('#ff8a3d',.14+.09*Math.sin(tGlobal*6));
    ctx.lineWidth=6;ctx.strokeRect(3,3,W-6,H-6);
  }
}

/* ================= main loop ================= */
let last=0;
function frame(ts){
  requestAnimationFrame(frame);
  const nw=ts/1000;
  let dt=Math.min(.033,nw-(last||nw));
  last=nw;tGlobal+=dt;
  if(freezeT>0){freezeT-=dt;dt=0;}
  if(!paused)update(dt);
  musicTick();
  draw();
  btnPause.classList.toggle('dim',state!==ST.PLAY||paused);
}

/* ================= boot ================= */
resize();
metaCard={id:'begin',st:'in',x:W/2,y:handY+220,a:0,vx:0,vy:0,rot:0};
if(document.fonts&&document.fonts.load){
  document.fonts.load("900 40px 'Grenze Gotisch'");
  document.fonts.load("700 14px 'Alegreya Sans'");
}
requestAnimationFrame(frame);
</script>
