          // Reserve the whole runway + braking zone so ice / later tiles can't
          // overlap the momentum trap.
          for (let kk = tail; kk <= boostGap.idx; kk++) {
            const cc = pA[kk];
            if (cc) gadgetCells.add('A:' + cc[1] + ',' + cc[0]);
          }
          placed = n;
        }
        if (placed === 0) {
          const idx = findStraightRun(mazeA, mazeA.path, 4);
          if (idx !== null) {
            for (let k = 0; k < Math.min(boostCount, 3); k++) {
              const i = idx + 1 + k;
              if (i >= mazeA.path.length - 2) break;
              const c = mazeA.path[i];
              const key = 'A:' + c[1] + ',' + c[0];
              if (gadgetCells.has(key)) continue;
              const [x, z] = cellToWorld(mazeA, c[0], c[1]);
              addBoostTile(x, z);
              gadgetCells.add(key);
            }
            // Reserve the whole straight so a later run (ice, extra boosts) can't
            // land on it too.
            for (let kk = 0; kk < 4; kk++) {
              const cc = mazeA.path[idx + kk];
              if (cc) gadgetCells.add('A:' + cc[1] + ',' + cc[0]);
            }
          }
        }
      }

      // Ice patches: from 22, a slippery 3-cell straight somewhere mid-run.
      if (levelNum >= 22) {
        const idx = findStraightRun(mazeA, mazeA.path, 3);
        if (idx !== null) {
          for (let k = 0; k < 3; k++) {
            const c = mazeA.path[idx + k];
            const [x, z] = cellToWorld(mazeA, c[0], c[1]);
            addIceTile(x, z);
          }
        }
      }

      // Portals (one pair normally, two pairs from level 27).
      if (portalA && portalB) {
        addPortalMesh(mazeA.centerX + (portalA[0] - centerCol) * cell, (portalA[1] - centerCol) * cell, 1);
        addPortalMesh(mazeB.centerX + (portalB[0] - centerCol) * cell, (portalB[1] - centerCol) * cell, 1);
        if (levelNum >= 27) {
          // Second crossing runs the other way: A's outer (west) edge ↔ B's outer
          // (east) edge, on a different row, keeping both crossings distinct.
          let a2w = null, b2e = null;
          for (const r of oddRowsNearCentre) {
            if (r === portalRow) continue;
            let aw = null;
            for (let c = 1; c <= size - 2; c++) {
              if (mazeA.grid[r][c] !== 0) continue;
              if (barrierCell && !reachable(mazeA.grid, [1, 1], [c, r], barrierCell)) break;
              aw = [c, r];
              break;
            }
            if (!aw) continue;
            let be = null;
            for (let c = size - 2; c >= 1; c--) {
              if (mazeB.grid[r][c] === 0) { be = [c, r]; break; }
            }
            if (!be) continue;
            if (dist(aw[1], aw[0], portalA[1], portalA[0]) < 3) continue;
            if (dist(be[1], be[0], portalB[1], portalB[0]) < 3) continue;
            a2w = aw; b2e = be;
            break;
          }
          if (a2w && b2e) {
            addPortalMesh(mazeA.centerX + (a2w[0] - centerCol) * cell, (a2w[1] - centerCol) * cell, 2);
            addPortalMesh(mazeB.centerX + (b2e[0] - centerCol) * cell, (b2e[1] - centerCol) * cell, 2);
          }
        }
      }

      // Goal
      const goalMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 0.1, 20), goalMat);
      goalMesh.position.set(levelData.goalPos.x, 0.05, levelData.goalPos.z);
      levelGroup.add(goalMesh);
      levelData.goalMesh = goalMesh;

      const goalLight = new THREE.PointLight(0xffcc66, 1.4, 4.0);
      goalLight.position.set(levelData.goalPos.x, 0.6, levelData.goalPos.z);
      levelGroup.add(goalLight);

      // Chaser enemies. Levels 8-14: one cube that spawns where the player
      // started and gives chase from level up. Level 15+: several cubes hidden
      // in dead ends that stay asleep until the player gets close, then wake
      // and chase.
      // Jump-wall cells are solid to roly-cubes too: the chasers need a legal,
      // grid-based route, so they must route around a jump wall (they can't leap
      // it) — this also keeps them from clipping through its rail.
      levelData.enemyGrid = mazeA.grid;
      if (levelData.jumpWalls.length) {
        const eg = mazeA.grid.map(row => row.slice());
        for (const jw of levelData.jumpWalls) eg[jw.r][jw.c] = 1;
        levelData.enemyGrid = eg;
      }
      levelData.centerCol = centerCol;
      levelData.enemyACenterX = mazeA.centerX;
      // Levels 8-14 the single chaser spawns where the player started and must
      // be free to pursue through the whole maze, so it gets NO route ban — it
      // could not take a single legal step from the entrance otherwise (its only
      // open neighbour is the route cell). From level 15 the sleeping alcove
      // cubes wake when the player draws near and then give REAL chase through
      // the maze (see buildEnemyProtect): only the handful of critical cells —
      // spawn, switch, portals, goal — stay off-limits to them, so a cube can
      // never camp the way forward even though it now hunts you down openly.
      levelData.enemyNoGo = (levelNum >= 15)
        ? buildEnemyNoGo(mazeA)
        : null;
      levelData.enemyProtect = (levelNum >= 15)
        ? buildEnemyProtect(mazeA, portalA, portalB, switchCell)
        : null;
      if (levelNum >= 15) {
        placeDeadEndEnemies(mazeA, portalA, portalB, levelNum, cell, centerCol);
      } else if (levelNum >= 8) {
        const e = addEnemyMesh(levelData.startPos.x, levelData.startPos.z, levelNum, 'chase');
        const sr = Math.round(levelData.startPos.z / cell + centerCol);
        const sc = Math.round((levelData.startPos.x - mazeA.centerX) / cell + centerCol);
        e.curlr = sr; e.curlc = sc;
      }

      // Ball, enemies, and HUD setup follow. The board floats as a clean island
      // with no outer frame border.

      ball.position.set(levelData.startPos.x, CONFIG.ballRadius, levelData.startPos.z);
      velocity.set(0, 0, 0);
      ballColor = 'neutral';
      greenBoost = 0;
      ball.material.color.set(0xccccdd);
    }

    // SERIALIZE HOST DATA TO SEND TO CLIENTS
    function getLevelDataPacket() {
        return {
            type: 'levelData',
            level: currentLevel,
            startPos: { x: levelData.startPos.x, z: levelData.startPos.z },
            goalPos: { x: levelData.goalPos.x, z: levelData.goalPos.z },
            size: levelData.size,
            mazeHalf: levelData.mazeHalf,
            viewHalf: levelData.viewHalf,
            gapHalf: levelData.gapHalf,
            dual: levelData.dual,
            walls: levelData.walls.map(w => ({
                x: w.position.x, z: w.position.z,
                isElectric: !!w.userData.isElectric,
                isJumpable: !!w.userData.isJumpable,
                isBarrier: !!w.userData.isBarrier,
                barrierColor: w.userData.barrierColor || null
            })),
            colorSwitches: levelData.colorSwitches.map(d => ({ x: d.x, z: d.z, color: d.color })),
            jumpPads: levelData.jumpPads.map(j => ({ x: j.x, z: j.z })),
            jumpWalls: levelData.jumpWalls.map(jw => ({ x: jw.x, z: jw.z })),
            boostTiles: levelData.boostTiles.map(t => ({ x: t.x, z: t.z })),
            iceTiles: levelData.iceTiles.map(t => ({ x: t.x, z: t.z })),
            portals: levelData.portals.map(p => ({ x: p.x, z: p.z, pair: p.pair })),
            enemyGrid: levelData.enemyGrid,
            centerCol: levelData.centerCol,
            enemyACenterX: levelData.enemyACenterX,
            enemyNoGo: levelData.enemyNoGo ? Array.from(levelData.enemyNoGo) : null,
            enemyProtect: levelData.enemyProtect ? Array.from(levelData.enemyProtect) : null,
            enemies: levelData.enemies.map(e => ({ x: e.homeX, z: e.homeZ, mode: e.mode }))
        };
    }

    // CLIENT BUILDER (Receives data from Host)
    function buildLevelFromData(data) {
      clearLevelScene();

      levelData.size = data.size;
      levelData.mazeHalf = data.mazeHalf || ((data.size - 1) / 2) * CONFIG.cellSize;
      levelData.viewHalf = data.viewHalf || levelData.mazeHalf;
      levelData.gapHalf = data.gapHalf || 0;
      levelData.dual = !!data.dual;
      levelData.startPos.set(data.startPos.x, 0, data.startPos.z);
      levelData.goalPos.set(data.goalPos.x, 0, data.goalPos.z);

      // Floors (two islands on dual levels)
      gridTex.repeat.set(Math.max(data.size, 4), Math.max(data.size, 4));
      const floorSize = levelData.mazeHalf * 2 + CONFIG.cellSize;
      if (levelData.dual) {
        addFloor(-(levelData.mazeHalf + levelData.gapHalf), 0, floorSize);
        addFloor(levelData.mazeHalf + levelData.gapHalf, 0, floorSize);
      } else {
        addFloor(0, 0, floorSize);
      }

      // Walls
      for (let wData of data.walls) {
        const mat = wData.isBarrier
          ? (wData.barrierColor === 'green' ? barrierMatGreen : barrierMatBlue)
          : (wData.isElectric ? electricMat : wallMat);
        const wall = addSolidWall(wData.x, wData.z, mat, {
          isElectric: !!wData.isElectric,
          isJumpable: !!wData.isJumpable,
          isBarrier: !!wData.isBarrier,
          barrierColor: wData.barrierColor || null,
        });
        if (wData.isBarrier) levelData.barriers.push({ mesh: wall, x: wData.x, z: wData.z, color: wData.barrierColor });
        if (wData.isElectric) levelData.electricWalls.push({ mesh: wall, x: wData.x, z: wData.z });
      }

      // Colour dots on the floor
      for (let dData of data.colorSwitches) {
        addColorDot(dData.x, dData.z, dData.color);
      }

      // Jump Pads
      for (let jData of data.jumpPads || []) {
        addJumpPad(jData.x, jData.z);
      }

      // Boost strips & ice patches
      for (let bData of data.boostTiles || []) addBoostTile(bData.x, bData.z);
      for (let iData of data.iceTiles || []) addIceTile(iData.x, iData.z);

      // Portals
      for (let pData of data.portals) {
        addPortalMesh(pData.x, pData.z, pData.pair);
      }

      // Chaser enemies. The client runs the SAME chase logic as the host
      // (toward the local ball), so it needs the maze grid + geometry sent in
      // the level packet instead of relying on throttled/absent host data.
      levelData.enemyGrid = data.enemyGrid || null;
      levelData.centerCol = data.centerCol || 0;
      levelData.enemyACenterX = (data.enemyACenterX !== undefined)
        ? data.enemyACenterX
        : (levelData.dual ? -(levelData.mazeHalf + levelData.gapHalf) : 0);
      levelData.enemyNoGo = data.enemyNoGo ? new Set(data.enemyNoGo) : null;
      levelData.enemyProtect = data.enemyProtect ? new Set(data.enemyProtect) : null;
      if (data.enemies) {
        for (let eData of data.enemies) {
          addEnemyMesh(eData.x, eData.z, data.level, eData.mode);
        }
        resetEnemies();
      }

      // Goal
      const goalMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 0.1, 20), goalMat);
      goalMesh.position.set(levelData.goalPos.x, 0.05, levelData.goalPos.z);
      levelGroup.add(goalMesh);
      levelData.goalMesh = goalMesh;

      const goalLight = new THREE.PointLight(0xffcc66, 1.4, 4.0);
      goalLight.position.set(levelData.goalPos.x, 0.6, levelData.goalPos.z);
      levelGroup.add(goalLight);

      // The board floats as a clean island with no outer frame border.

      ball.position.set(levelData.startPos.x, CONFIG.ballRadius, levelData.startPos.z);
      velocity.set(0, 0, 0);
    }

    // =========================================================================
    // 6.  BALL, PHYSICS, CAMERA
    // =========================================================================
    const cubeRenderTarget = new THREE.WebGLCubeRenderTarget(128);
    const cubeCamera = new THREE.CubeCamera(0.1, 100, cubeRenderTarget);

    const ballMat = new THREE.MeshStandardMaterial({
      color: 0xccccdd,
      metalness: 0.95,
      roughness: 0.1,
      envMap: cubeRenderTarget.texture,
      envMapIntensity: 1.2,
    });
    const ball = new THREE.Mesh(new THREE.SphereGeometry(CONFIG.ballRadius, 32, 32), ballMat);
    ball.castShadow = true;
    titleGroup.add(ball);
    ball.scale.set(4, 4, 4);
    ball.position.set(0, 3.2, 0);
    ball.rotation.y = 0.8;

    const ballLight = new THREE.PointLight(0x88aaff, 1.2, 6);
    ballLight.position.set(0, 4.4, 0);
    titleGroup.add(ballLight);

    let velocity = new THREE.Vector3(0,0,0);
    let currentRotX = 0, currentRotZ = 0;
    let winTimer = 0;
    let transitioning = false;
    let gameActive = false;
    let currentLevel = 1;
    const totalLevels = CONFIG.totalLevels;
    let frameCount = 0;

    const minimapCanvas = document.getElementById('minimap');
    const minimapCtx = minimapCanvas.getContext('2d');

    function prepareGameBall() {
      // Return the ball (and its light) to the board once the title screen ends
      if (ball.parent !== tableGroup) {
        titleGroup.remove(ball);
        titleGroup.remove(ballLight);
        tableGroup.add(ball);
        tableGroup.add(ballLight);
      }
      ball.scale.set(1, 1, 1);
      ball.rotation.set(0, 0, 0);
      ballLight.position.set(0, 0.5, 0);
    }

    function resetBall() {
      ball.position.set(levelData.startPos.x, CONFIG.ballRadius, levelData.startPos.z);
      velocity.set(0, 0, 0);
      ballColor = 'neutral';
      greenBoost = 0;
      ball.material.color.set(0xccccdd);
      resetEnemies();
    }

    // -- GAME AUDIO ---------------------------------------------------------
    // One shared AudioContext created on the first user gesture (browser
    // autoplay policy). Everything routes through a soft compressor and a short
    // feedback echo, and the chaser runs a layered proximity drone (two beating
    // lows + a filtered noise bed) instead of a static 62Hz buzz.
    let audio = null;
    let lastImpactSound = 0; // cooldown so hard-wall hits don't rattle
    function ensureAudio() {
      if (audio) {
        if (audio.ctx.state === 'suspended') audio.ctx.resume();
        return audio.ctx;
      }
      if (!window.AudioContext && !window.webkitAudioContext) return null;
      const AC = window.AudioContext || window.webkitAudioContext;
      const ctx = new AC();

      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -16;
      comp.knee.value = 22;
      comp.ratio.value = 7;
      comp.attack.value = 0.004;
      comp.release.value = 0.12;

      const master = ctx.createGain();
      master.gain.value = 0.62;
      master.connect(comp);
      comp.connect(ctx.destination);

      const fxBus = ctx.createGain();
      fxBus.connect(master);

      const delay = ctx.createDelay(1.0);
      delay.delayTime.value = 0.27;
      const damp = ctx.createBiquadFilter();
      damp.type = 'lowpass'; damp.frequency.value = 2400;
      const feed = ctx.createGain();
      feed.gain.value = 0.34;
      const wet = ctx.createGain();
      wet.gain.value = 0.30;
      fxBus.connect(delay);
      delay.connect(damp); damp.connect(feed); feed.connect(delay);
      delay.connect(wet); wet.connect(master);

      const noiseBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate), ctx.sampleRate);
      const nd = noiseBuf.getChannelData(0);
      for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;

      audio = { ctx, master, fxBus, noiseBuf };
      return ctx;
    }

    // One-shot tone: oscillator + attack/decay envelope + shared echo tap.
    function tone(o) {
      const ctx = audio.ctx, t = ctx.currentTime;
      const t0 = isFinite(o.t0) ? o.t0 : 0;
      const dur = isFinite(o.dur) && o.dur > 0.02 ? o.dur : 0.1;
      const f = isFinite(o.f) ? o.f : 200;
      const glide = isFinite(o.glide) ? o.glide : 0;
      const vol = isFinite(o.vol) ? o.vol : 0.05;
      const osc = ctx.createOscillator();
      osc.type = o.type || 'sine';
      osc.frequency.setValueAtTime(Math.max(20, f), t + t0);
      if (glide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, glide), t + t0 + dur);
      if (o.detune) osc.detune.setValueAtTime(o.detune, t + t0);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, t + t0);
      g.gain.linearRampToValueAtTime(vol, t + t0 + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + t0 + dur);
      osc.connect(g); g.connect(audio.fxBus);
      osc.start(t + t0); osc.stop(t + t0 + dur + 0.06);
    }

    // Filtered white-noise burst with sweeping cutoff and loudness envelope.
    function burst(o) {
      const ctx = audio.ctx, t = ctx.currentTime;
      const t0 = isFinite(o.t0) ? o.t0 : 0;
      const dur = isFinite(o.dur) && o.dur > 0.02 ? o.dur : 0.1;
      const f0 = isFinite(o.f) ? o.f : 1000;
      const f1 = (isFinite(o.f1) && o.f1 !== f0) ? o.f1 : 0;
      const vol = isFinite(o.vol) ? o.vol : 0.05;
      const src = ctx.createBufferSource();
      src.buffer = audio.noiseBuf;
      src.loop = true;
      const flt = ctx.createBiquadFilter();
      flt.type = o.kind || 'bandpass';
      flt.Q.value = isFinite(o.q) ? o.q : 0.7;
      flt.frequency.setValueAtTime(Math.max(40, f0), t + t0);
      if (f1) flt.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t + t0 + dur);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, t + t0);
      g.gain.linearRampToValueAtTime(vol, t + t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + t0 + dur);
      src.connect(flt); flt.connect(g); g.connect(audio.fxBus);
      src.start(t + t0); src.stop(t + t0 + dur + 0.05);
    }

    // One-shot procedural sound effect.
    function sfx(kind, int) {
      const ctx = ensureAudio(); if (!ctx || !audio) return;
      const intensity = isFinite(int) ? Math.max(0, Math.min(1, int)) : 0.5;
      if (kind === 'portal') {
        tone({ type: 'sine', f: 660, dur: 0.5, vol: 0.12 });
        tone({ type: 'sine', f: 880, t0: 0.07, dur: 0.5, vol: 0.10 });
        tone({ type: 'sine', f: 1100, t0: 0.14, dur: 0.45, vol: 0.08 });
        burst({ f: 900, f1: 3800, t0: 0.02, dur: 0.35, vol: 0.06, q: 0.6 });
        return;
      }
      if (kind === 'win') {
        const C5 = 523.25, E5 = 659.25, G5 = 783.99, C6 = 1046.5;
        tone({ type: 'triangle', f: C5, dur: 0.5, vol: 0.13 });
        tone({ type: 'triangle', f: E5, t0: 0.11, dur: 0.55, vol: 0.13 });
        tone({ type: 'sine', f: G5, t0: 0.22, dur: 0.8, vol: 0.12 });
        tone({ type: 'sine', f: C6, t0: 0.38, dur: 1.1, vol: 0.14 });
        tone({ type: 'sine', f: G5 * 2, t0: 0.62, dur: 0.5, vol: 0.05, detune: 6 });
        burst({ kind: 'highpass', f: 6000, t0: 0.38, dur: 0.5, vol: 0.035 });
        return;
      }
      if (kind === 'boom') {
        tone({ type: 'sine', f: 55, glide: 38, dur: 0.5, vol: 0.30 });
        tone({ type: 'sawtooth', f: 130, glide: 70, dur: 0.32, vol: 0.16 });
        burst({ kind: 'lowpass', f: 600, f1: 120, t0: 0, dur: 0.22, vol: 0.16, q: 0.5 });
        return;
      }
      if (kind === 'pickup') {
        tone({ type: 'square', f: 740, dur: 0.09, vol: 0.06 });
        tone({ type: 'square', f: 1100, t0: 0.07, dur: 0.12, vol: 0.06 });
        tone({ type: 'sine', f: 1480, t0: 0.14, dur: 0.18, vol: 0.05 });
        return;
      }
      if (kind === 'catch') {
        tone({ type: 'sawtooth', f: 240, glide: 85, dur: 0.4, vol: 0.18 });
        tone({ type: 'square', f: 170, glide: 55, t0: 0.03, dur: 0.42, vol: 0.12 });
        burst({ f: 700, f1: 220, t0: 0, dur: 0.18, vol: 0.14, q: 0.9 });
        return;
      }
      if (kind === 'jump') {
        tone({ type: 'sine', f: 260, glide: 560, dur: 0.22, vol: 0.08 });
        burst({ f: 500, f1: 2400, t0: 0, dur: 0.16, vol: 0.05, q: 0.7 });
        return;
      }
      if (kind === 'boost') {
        tone({ type: 'sawtooth', f: 85, glide: 240, dur: 0.6, vol: 0.16 });
        tone({ type: 'square', f: 170, glide: 480, t0: 0.05, dur: 0.6, vol: 0.09 });
        burst({ f: 350, f1: 2000, t0: 0.02, dur: 0.5, vol: 0.07, q: 0.8 });
        return;
      }
      if (kind === 'electric') {
        for (let i = 0; i < 4; i++) burst({ f: 2600 + Math.random() * 2400, t0: i * 0.05, dur: 0.07, vol: 0.09, q: 8 });
        tone({ type: 'square', f: 1200, dur: 0.1, vol: 0.05 });
        return;
      }
      if (kind === 'impact') {
        // Dull knock, pitches with impact speed.
        const v = 0.55 + intensity * 0.45;
        tone({ type: 'triangle', f: 200 + intensity * 120, glide: 120, dur: 0.16, vol: 0.16 * v });
        tone({ type: 'sine', f: 120, glide: 70, dur: 0.18, vol: 0.10 * v });
        burst({ kind: 'lowpass', f: 900, f1: 300, t0: 0, dur: 0.09, vol: 0.09 * v, q: 0.6 });
        if (intensity > 0.5) burst({ f: 2400, t0: 0, dur: 0.06, vol: 0.05, q: 3 });
      }
    }

    // -- CHASER ENEMY: layered proximity drone ---------------------------------
    let chaser = null;
    function startChaserSound() {
      const ctx = ensureAudio(); if (!ctx || !audio || chaser) return;
      const t = ctx.currentTime;
      const bus = ctx.createGain(); bus.gain.value = 0;
      bus.connect(audio.master);

      const flt = ctx.createBiquadFilter();
      flt.type = 'lowpass'; flt.frequency.value = 160; flt.Q.value = 5;

      const o1 = ctx.createOscillator(); o1.type = 'triangle'; o1.frequency.value = 54;
      const o2 = ctx.createOscillator(); o2.type = 'triangle'; o2.frequency.value = 57.6;
      const o3 = ctx.createOscillator(); o3.type = 'sawtooth'; o3.frequency.value = 108;
      for (const o of [o1, o2, o3]) { o.connect(flt); o.start(t); }

      const nsrc = ctx.createBufferSource();
      nsrc.buffer = audio.noiseBuf; nsrc.loop = true;
      const nf = ctx.createBiquadFilter();
      nf.type = 'lowpass'; nf.frequency.value = 900; nf.Q.value = 3;
      const ng = ctx.createGain(); ng.gain.value = 0;
      nsrc.connect(nf); nf.connect(ng); ng.connect(flt); nsrc.start(t);

      const ampLfo = ctx.createOscillator(); ampLfo.type = 'sine'; ampLfo.frequency.value = 5.5;
      const ampLfoG = ctx.createGain(); ampLfoG.gain.value = 0;
      ampLfo.connect(ampLfoG); ampLfoG.connect(bus.gain); ampLfo.start(t);

      const pitLfo = ctx.createOscillator(); pitLfo.type = 'sine'; pitLfo.frequency.value = 0.2;
      const pitLfoG = ctx.createGain(); pitLfoG.gain.value = 0;
      pitLfo.connect(pitLfoG); pitLfoG.connect(flt.frequency); pitLfo.start(t);

      flt.connect(bus);
      chaser = { bus, flt, o1, o2, o3, nsrc, ng, ampLfo, ampLfoG, pitLfo, pitLfoG };
    }
    function updateChaserSound(prox) {
      if (!chaser) return;
      const ctx = audio.ctx;
      if (!isFinite(prox)) prox = 0;
      prox = Math.max(0, Math.min(1, prox));
      const vol = prox > 0 ? 0.06 + prox * prox * 0.34 : 0;
      chaser.bus.gain.setTargetAtTime(vol, ctx.currentTime, 0.12);
      chaser.flt.frequency.setTargetAtTime(140 + prox * prox * 950, ctx.currentTime, 0.18);
      chaser.ampLfoG.gain.setTargetAtTime(prox > 0 ? vol * 0.65 : 0, ctx.currentTime, 0.15);
      chaser.pitLfoG.gain.setTargetAtTime(prox > 0 ? 4 + prox * prox * 7 : 0, ctx.currentTime, 0.25);
      chaser.ng.gain.setTargetAtTime(prox > 0 ? prox * prox * 0.06 : 0, ctx.currentTime, 0.2);
    }
    function stopChaserSound() {
      if (!chaser) return;
      const ctx = audio.ctx, t = ctx.currentTime;
      chaser.bus.gain.setTargetAtTime(0, t, 0.1);
      const parts = [chaser.o1, chaser.o2, chaser.o3, chaser.ampLfo, chaser.pitLfo, chaser.nsrc];
      for (const o of parts) { try { o.stop(t + 0.9); } catch (e) {} }
      chaser = null;
    }

    // Settle a cube into its dormant home state: small, dim, still in its
    // alcove, waiting to be approached before it wakes again.
    function dozeEnemy(e) {
      e.x = e.homeX; e.z = e.homeZ;
      e.mesh.position.set(e.x, 0.4, e.z);
      e.mesh.quaternion.identity();
      e.roll = 0;
      e.flipT = 0; e.waitT = 0;
      e.sleeping = true;
      e.active = false;
      e.returning = false;
      e.chaseT = 0; e.retStall = 0;
    }

    // Reset every chaser to its alcove, still and silent.
    function resetEnemies() {
      const cell = CONFIG.cellSize, centerCol = levelData.centerCol;
      for (const e of levelData.enemies) {
        e.x = e.homeX; e.z = e.homeZ;
        e.active = e.mode === 'sleeper';     // sleepers are set to spring the instant they wake
        e.sleeping = e.mode === 'sleeper';
        e.delay = e.mode === 'sleeper' ? 0.2 : 5.0;
        e.spawnT = 0;
        e.path = null; e.node = 0;
        e.flipT = 0; e.waitT = 0; e.grace = 0;
        e.chaseT = 0; e.rest = false; e.restT = 0; e.returning = false; e.retStall = 0;
        const hc = Math.round((e.homeX - levelData.enemyACenterX) / cell + centerCol);
        const hr = Math.round(e.homeZ / cell + centerCol);
        e.cr = hr; e.cc = hc;
        e.mesh.position.set(e.homeX, 0.4, e.homeZ);
        e.mesh.rotation.set(0, 0, 0);
        e.mesh.quaternion.identity();
        e.mesh.position.y = 0.4;
        e.mesh.visible = e.mode === 'sleeper'; // sleeping cubes are dimly visible in their alcove
        e.mesh.material.emissiveIntensity = e.mode === 'sleeper' ? 0.10 : 0.25;
        e.mesh.scale.set(e.mode === 'sleeper' ? 0.6 : 1, e.mode === 'sleeper' ? 0.6 : 1, e.mode === 'sleeper' ? 0.6 : 1);
      }
      stopChaserSound();
    }

    // Chase logic: the cube rolls along the maze grid toward the player's cell.
    function updateEnemys(dt) {
      if (levelData.enemies.length === 0) return;
      const grid = levelData.enemyGrid;
      if (!grid) return;
      const cell = CONFIG.cellSize;
      const centerCol = levelData.centerCol;
      const r = CONFIG.ballRadius + 0.42; // catch distance

      // Where is the player relative to the A-island grid?
      const pCol = Math.round((ball.position.x - levelData.enemyACenterX) / cell + centerCol);
      const pRow = Math.round(ball.position.z / cell + centerCol);
      const onGrid = grid[pRow] && grid[pRow][pCol] === 0;

      for (const e of levelData.enemies) {
        // Guard against any NaN/infinite drifting coordinates
        if (!isFinite(e.x) || !isFinite(e.z)) {
          e.x = e.homeX; e.z = e.homeZ;
          e.mesh.position.set(e.x, e.mesh.position.y, e.z);
        }
        const dToBall = Math.hypot(e.x - ball.position.x, e.z - ball.position.z);

        // A dormant cube (either a sleeping dead-end cube, or a chaser that has
        // given up and gone back to its base): keep it small, dim and still in
        // its alcove until the player draws near, then wake it into a chaser.
        if (e.sleeping) {
          e.mesh.position.set(e.x, 0.4, e.z);
          e.mesh.quaternion.identity();
          e.mesh.visible = true;
          e.mesh.scale.set(0.6, 0.6, 0.6);
          e.mesh.material.emissiveIntensity = 0.08 + 0.04 * (0.5 + 0.5 * Math.sin(performance.now() / 800));
          if (dToBall < e.wakeR * cell) {
            e.sleeping = false;
            e.active = true;
            e.returning = false;
            e.chaseT = 0;
            e.spawnT = 0.35;     // pop-in as it springs to full size
            e.mesh.visible = true;
            startChaserSound();
          }
          continue;
        }

        // Wait the short delay, then start chasing the player.
        if (!e.active) {
          if (!transitioning) {
            e.delay -= dt;
            if (e.delay <= 0) {
              e.active = true;
              e.spawnT = 0.35;   // pop-in duration
              e.mesh.visible = true;
              startChaserSound();
            }
          }
          updateChaserSound(0);
          continue;
        }

        // Pulse scale/glow with proximity (fast + strong when close). The cube
        // also "pops in" (grows to full size) over the first moments after it
        // appears, so its arrival is visible.
        const prox = Math.max(0, Math.min(1, 1 - dToBall / 5.0));
        e.pulseTimer += dt * (0.8 + prox * 6);
        const pulse = 1 + prox * 0.28 * (0.5 + 0.5 * Math.sin(e.pulseTimer));
        let spawnK = 1;
        if (e.spawnT > 0) {
          e.spawnT -= dt;
          spawnK = Math.min(1, 1 - Math.max(0, e.spawnT) / 0.35);
        }
        const s = (0.2 + 0.8 * spawnK) * pulse;
        e.mesh.scale.set(s, s, s);
        e.mesh.material.emissiveIntensity = 0.25 + prox * 2.2;
        updateChaserSound(prox);

        // Fair re-entry grace after a portal crossing: the cube holds still so
        // it can never be sitting right on the exit waiting to instant-catch you.
        if (e.grace > 0) {
          e.grace -= dt;
          continue;
        }

        // Rest / return-to-base cycle: the cube will NOT chase forever, so it can
        // never camp the only exit. After a stretch of pursuit it stands down and
        // dims for a moment (right then is your chance to slip past), then it
        // gives up and tromps back to its home. Once back it goes dormant (small
        // and dim in its alcove) and only springs awake again if you come near.
        const CHASE_BUDGET = 20.0; // seconds hunting before it tires
        const REST_TIME = 2.0;     // how long it stops before heading home
        if (e.rest) {
          e.restT -= dt;
          e.mesh.material.emissiveIntensity = 0.12;
          updateChaserSound(0);
          if (e.restT <= 0) { e.rest = false; e.returning = true; e.chaseT = 0; }
          continue; // resting cubes don't chase and can't catch
        } else if (e.returning) {
          // Make for home, ignoring the player. Retrace toward the alcove, then
          // doze. The cube can't step onto the solution route, so if the way
          // home is blocked it settles right where it safely stopped.
          const hc = Math.round((e.homeX - levelData.enemyACenterX) / cell + centerCol);
          const hr = Math.round(e.homeZ / cell + centerCol);
          const cr = Math.round(e.z / cell + centerCol);
          const cc = Math.round((e.x - levelData.enemyACenterX) / cell + centerCol);
          e.mesh.material.emissiveIntensity = 0.2;
          updateChaserSound(0);
          const distHome = Math.abs(cr - hr) + Math.abs(cc - hc);
          if (distHome <= 1) {
            dozeEnemy(e);
          } else if (e.retStall > 1.0) {
            // Can't make progress toward home (route blocks the last step, or
            // it's stranded in an off-route pocket) — settle wherever it got.
            dozeEnemy(e);
          } else {
            const before = e.x + ',' + e.z;
            stepEnemyChase(e, grid, cell, centerCol, dt, false, hr, hc);
            e.retStall = (e.x + ',' + e.z === before) ? e.retStall + dt : 0;
          }
          continue;
        } else {
          // If the player escapes beyond sight range the cube loses the scent,
          // stands down and tromps home — a wake can pressure you but never lock
          // you out of finishing the maze.
          if (e.chaseT > 1.0 && dToBall > 8.0 * cell) {
            e.rest = true;
            e.restT = REST_TIME;
            e.chaseT = 0;
            e.roll = 0;
            continue;
          }
          // Only burn the budget while the cube is actually bearing down.
          if (e.flipT > 0 || e.waitT > 0 || dToBall < 4.0) e.chaseT += dt;
          if (e.chaseT >= CHASE_BUDGET) {
            e.rest = true;
            e.restT = REST_TIME;
            e.chaseT = 0;
            e.roll = 0;
            continue;
          }
        }

        // Decide where the cube should head next, then let the discrete
        // flipper either run an in-progress tumble, wait its pause, or start a
        // new single-cell flip (pathfinding is done fresh inside the flipper).
        if (!onGrid) {
          // The player left this island (portal): the cube heads back home.
          const hc = Math.round((e.homeX - levelData.enemyACenterX) / cell + centerCol);
          const hr = Math.round(e.homeZ / cell + centerCol);
          stepEnemyChase(e, grid, cell, centerCol, dt, false, hr, hc);
        } else {
          stepEnemyChase(e, grid, cell, centerCol, dt, true, pRow, pCol);
        }

        // Caught the player? Never inside the goal pocket — a chaser can pressure
        // the finish line but can't deny the 1s hold, so the level always ends.
        const dNow = Math.hypot(e.x - ball.position.x, e.z - ball.position.z);
        const atGoal = Math.hypot(ball.position.x - levelData.goalPos.x, ball.position.z - levelData.goalPos.z) < 1.0;
        if (dNow < r && !atGoal) {
          triggerParticles('death', e.mesh.position);
          sfx('catch');
          showOverlay('😱 The cube caught you!', 'Roll away before it strikes!', 1.5);
          resetBall();
          return;
        }
      }
    }

    // IKU-style chase: the cube moves one cell at a time, tumbling a full 90°,
    // pausing a beat, then tumbling again. Keep the cell-to-cell pace BELOW the
    // ball's comfortable cruise so a rolling player can always pull away — the
    // threat is the lunge and the catch-if-you-stop, not an unescapable pursuit.
    const EN_FLIP = 0.40;   // seconds for one 90° tumble between cells
    const EN_PAUSE = 0.30;  // seconds paused on a cell before the next tumble

    // Advance the cube through its tumble / pause state machine.
    //  onGrid: whether the player is on this island (else the cube heads home).
    //  tr/tc: the player's grid cell (row,col), or the home cell when off-grid.
    // The cube's own cell is derived fresh from its live world position every
    // step, so chasing never stalls on stale bookkeeping.
    function stepEnemyChase(e, grid, cell, centerCol, dt, onGrid, tr, tc) {
      // In the middle of a tumble — just keep animating it.
      if (e.flipT > 0) { advanceEnemyFlip(e, dt); return; }
      // Paused between tumbles — count down the idle beat.
      if (e.waitT > 0) { e.waitT -= dt; return; }

      const cr = Math.round(e.z / cell + centerCol);                                  // enemy row
      const cc = Math.round((e.x - levelData.enemyACenterX) / cell + centerCol);      // enemy col

      // Pick the cell we want to end up on THIS step. While the player is on this
      // island the cube gives genuine chase — it may walk the solution route and
      // everything else, only the critical cells (spawn / switch / portals / goal)
      // stay off-limits. When the player is elsewhere the cube heads home and then
      // respects the full route ban so it never prowls the player's corridor.
      const noGo = onGrid ? (levelData.enemyProtect || levelData.enemyNoGo) : levelData.enemyNoGo;
      const offLimits = (r, c) => noGo && noGo.has(r + ',' + c);
      let ntr, ntc;
      if (onGrid) {
        // Freshly pathfind from the cube's live cell to the player.
        const from = getPath(grid, cc, cr, tc, tr, noGo);
        if (!from || from.length === 0) return;      // no route — wait and retry
        // Walk backwards to the first reachable cell adjacent to where we are.
        // If that cell is a protected route cell, don't enter it — hold the edge.
        let found = false;
        for (let i = from.length - 1; i >= 0; i--) {
          const c = from[i][0], r = from[i][1];
          if (Math.abs(r - cr) + Math.abs(c - cc) <= 1) {
            if (offLimits(r, c)) break;   // the way is blocked by the route — wait
            ntr = r; ntc = c; found = true; break;
          }
        }
        if (!found) return;
      } else {
        // Off-grid: the cube heads back toward its home/alcove cell, still
        // staying off the solution route.
        const from = getPath(grid, cc, cr, tc, tr, noGo);
        if (!from || from.length === 0) return;      // nowhere to retreat — wait
        let found = false;
        for (let i = from.length - 1; i >= 0; i--) {
          const c = from[i][0], r = from[i][1];
          if (Math.abs(r - cr) + Math.abs(c - cc) <= 1) {
            if (offLimits(r, c)) break;   // route blocks the way — wait here
            ntr = r; ntc = c; found = true; break;
          }
        }
        if (!found) return;
      }
      if (ntr === cr && ntc === cc) return; // nowhere to go — stay put

      // Guard: a single flip only ever moves to an ADJACENT cell. This both
      // stops a far target from teleporting in one tumble and keeps the cube
      // chasing one cell at a time (fair, never unfair to the player).
      if (Math.abs(ntr - cr) + Math.abs(ntc - cc) > 1) {
        const dr = Math.sign(ntr - cr), dc = Math.sign(ntc - cc);
        ntr = cr + dr; ntc = cc + dc;
      }

      e.cr = cr; e.cc = cc;                     // current cell (start of this flip)
      startEnemyFlip(e, cell, centerCol, ntr, ntc);
    }

    // Begin a single-cell flip into grid cell (tr, tc).
    function startEnemyFlip(e, cell, centerCol, tr, tc) {
      const centerX = levelData.enemyACenterX;
      e.fromX = e.x; e.fromZ = e.z;
      e.toX = centerX + (tc - centerCol) * cell;
      e.toZ = (tr - centerCol) * cell;
      let dx = e.toX - e.fromX, dz = e.toZ - e.fromZ;
      const d = Math.hypot(dx, dz);
      if (d < 0.0001) { e.flipT = 0; return; }
      dx /= d; dz /= d;
      e.dirX = dx; e.dirZ = dz;
      e.fcr = tr; e.fcc = tc;
      // Pick the horizontal world axis to rotate about for this step.
      if (Math.abs(dx) >= Math.abs(dz)) {
        // rolling along X -> rotate about world Z, +X rolls backward (-90°)
        e.rollAxis = new THREE.Vector3(0, 0, 1);
        e.rollSign = -Math.sign(dx);
      } else {
        // rolling along Z -> rotate about world X, +Z rolls forward (+90°)
        e.rollAxis = new THREE.Vector3(1, 0, 0);
        e.rollSign = Math.sign(dz);
      }
      e.flipT = EN_FLIP;
      e.waitT = 0;
    }

    // Animate an in-progress tumble. The quaternion is recomputed fresh every
    // frame from the base aligned state, so the cube never accumulates drift.
    function advanceEnemyFlip(e, dt) {
      e.flipT -= dt;
      if (e.flipT < 0) e.flipT = 0;
      const t = e.flipT > 0 ? 1 - e.flipT / EN_FLIP : 1; // 0 -> 1
      const k = t * t * (3 - 2 * t);                    // smoothstep easing
      e.x = e.fromX + (e.toX - e.fromX) * k;
      e.z = e.fromZ + (e.toZ - e.fromZ) * k;
      e.mesh.position.set(e.x, e.mesh.position.y, e.z);
      const ang = e.rollSign * (Math.PI / 2) * t;
      e.mesh.quaternion.setFromAxisAngle(e.rollAxis, ang);
      liftCube(e);
      if (t >= 1) {
        // Landed: snap to the cell centre, axis-aligned, and rest a beat.
        e.x = e.toX; e.z = e.toZ;
        e.cr = e.fcr; e.cc = e.fcc;
        e.flipT = 0;
        e.mesh.quaternion.identity();
        e.mesh.position.set(e.x, 0.4, e.z);
        e.waitT = EN_PAUSE;
      }
    }

    // Lift the cube so its lowest rotated corner always touches the ground.
    // Rolling about a horizontal axis tips a corner beneath the centre height,
    // which would otherwise clip through the floor; we compute the box's 8
    // rotated corners and raise the mesh until the lowest one sits on the plane.
    function liftCube(e) {
      const m = e.mesh;
      const h = 0.4 * m.scale.x; // uniform pop-in/pulse scale shrinks the box
      const q = m.quaternion;
      let minY = Infinity;
      for (let sx = -1; sx <= 1; sx += 2)
        for (let sy = -1; sy <= 1; sy += 2)
          for (let sz = -1; sz <= 1; sz += 2) {
            const v = new THREE.Vector3(sx * h, sy * h, sz * h).applyQuaternion(q);
            if (v.y < minY) minY = v.y;
          }
      m.position.y = -minY;
    }

    function physicsUpdate(dt) {
      if (!gameActive) return;
      if (transitioning) return;
      const tiltX = currentRotX;
      const tiltZ = currentRotZ;
      const ax = -CONFIG.gravity * Math.sin(tiltZ);
      const az = CONFIG.gravity * Math.sin(tiltX);
      velocity.x += ax * dt;
      velocity.z += az * dt;
      // Ice patches wash out the friction — the ball slides while over one.
      let onIce = false;
      if (ball.position.y <= CONFIG.ballRadius + 0.01) {
        for (const t of levelData.iceTiles) {
          const idx = ball.position.x - t.x, idz = ball.position.z - t.z;
          if (idx*idx + idz*idz < (0.28 + CONFIG.ballRadius) * (0.28 + CONFIG.ballRadius)) { onIce = true; break; }
        }
      }
      const frictionNow = onIce ? 0.9995 : CONFIG.friction;
      velocity.multiplyScalar(Math.pow(frictionNow, dt * 60));

      for (let j of levelData.jumpPads) {
        const dx = ball.position.x - j.x;
        const dz = ball.position.z - j.z;
        if (dx*dx + dz*dz < (0.35 + CONFIG.ballRadius) * (0.35 + CONFIG.ballRadius)) {
          if (ball.position.y <= CONFIG.ballRadius + 0.02 && velocity.y <= 0.5) {
            const tPad = performance.now();
            if (tPad - (j.last || 0) > 650) {
              j.last = tPad;
              velocity.y = CONFIG.jumpBoost;
              // A forward assist so a slow approach still clears the jump-wall:
              // the pad doubles your roll speed at launch (capped so it can never
              // turn into a rocket), which is what makes the wall a fair, deliberate
              // hop rather than a pixel-perfect one.
              const sp = Math.hypot(velocity.x, velocity.z);
              if (sp > 0.1) { const k = Math.min(6.5 / sp, 1.9); velocity.x *= k; velocity.z *= k; }
              triggerParticles('jump', ball.position);
              sfx('jump');
            }
          }
        }
      }

      // Boost strips fling the ball forward along its heading (capped + throttled
      // so a ball skimming a strip gets one kick, not a per-frame ramp-up).
      {
        const tNow = performance.now();
        for (const t of levelData.boostTiles) {
          const bdx = ball.position.x - t.x, bdz = ball.position.z - t.z;
          if (bdx*bdx + bdz*bdz < (0.28 + CONFIG.ballRadius) * (0.28 + CONFIG.ballRadius)) {
            const sp = Math.hypot(velocity.x, velocity.z);
            if (sp > 0.05 && sp < 5.5 && tNow - (t.last || 0) > 250) {
              t.last = tNow;
              const push = Math.pow(2.2, dt);
              const ns = Math.min(sp * push, 5.5);
              velocity.x *= ns / sp; velocity.z *= ns / sp;
              triggerParticles('switch', ball.position, 0x22ff88);
              sfx('pickup');
            }
          }
        }
      }

      // Green-boost surge: accelerates along your current heading up to a hard
      // cap, with a green trail so the Wipeout feel reads visually.
      if (greenBoost > 0) {
        greenBoost -= dt;
        const sp = Math.hypot(velocity.x, velocity.z);
        if (sp > 0.05) {
          const hx = velocity.x / sp, hz = velocity.z / sp;
          const ns = Math.min(sp + CONFIG.greenBoostAccel * dt, CONFIG.greenBoostCap);
          velocity.x = hx * ns; velocity.z = hz * ns;
          if (frameCount % 3 === 0) triggerParticles('boost', ball.position);
        }
      }

      ball.position.x += velocity.x * dt;
      ball.position.z += velocity.z * dt;

      // Simple vertical gravity for jump-pad hops (only while airborne, so the
      // grounded roll is never disturbed).
      if (ball.position.y > CONFIG.ballRadius) {
        velocity.y -= CONFIG.jumpGravity * dt;
        if (velocity.y < -12) velocity.y = -12;
      }
      ball.position.y += velocity.y * dt;

      const r = CONFIG.ballRadius;
      const bX = ball.position.x, bZ = ball.position.z;
      // Off-maze = past the border of the whole footprint, or (dual levels) in
      // the void gap between the two islands.
      const offMaze = levelData.dual
        ? (Math.abs(bZ) > levelData.mazeHalf || Math.abs(bX) > levelData.viewHalf || Math.abs(bX) < levelData.gapHalf)
        : (Math.abs(bX) > levelData.mazeHalf || Math.abs(bZ) > levelData.mazeHalf);

      if (offMaze) {
        // Past the border walls (through a gap): no floor here, fall into the void
        velocity.y = Math.min(velocity.y, -9);
      } else {
        if (ball.position.y < CONFIG.ballRadius) {
          ball.position.y = CONFIG.ballRadius;
          velocity.y *= -0.2;
          if (Math.abs(velocity.y) < 0.1) velocity.y = 0;
        }
      }
      if (ball.position.y < -6) {
        triggerParticles('death', ball.position);
        sfx('boom');
        resetBall();
        showOverlay('💀 Rolled off the maze!', 'Mind the gaps in the walls!', 1.4);
        return;
      }

      for (let i = levelData.walls.length - 1; i >= 0; i--) {
        const wall = levelData.walls[i];
        const wPos = wall.position;
        // Jump-pad launch lets the ball hop a low electric rail — and a jump-wall is
        // a rail you MUST hop, so it shares the same airborne pass rule: while
        // the ball is flying above the wall top it simply passes through.
        const airborneOver = ball.position.y - r > CONFIG.wallHeight;
        if (airborneOver && (wall.userData.isElectric || wall.userData.isJumpable)) continue;
        const halfCell = CONFIG.cellSize/2;
        const dx = ball.position.x - wPos.x;
        const dz = ball.position.z - wPos.z;
        if (Math.abs(dx) < halfCell + r && Math.abs(dz) < halfCell + r) {
          const overlapX = halfCell + r - Math.abs(dx);
          const overlapZ = halfCell + r - Math.abs(dz);

          let canPass = false;

          if (wall.userData.isElectric) {
            canPass = true; // touching an electric wall = explosion
          }
          else if (wall.userData.isBarrier) {
            if (ballColor === wall.userData.barrierColor) {
              canPass = true;
            }
          }

          if (!canPass) {
            // Capture the approach speed before the bounce so we can tell a
            // gentle nudge from a hard slam (and add a flourish for the latter).
            const impactVx = velocity.x, impactVz = velocity.z;
            if (overlapX < overlapZ) {
              ball.position.x += Math.sign(dx) * overlapX;
              velocity.x *= -0.2;
            } else {
              ball.position.z += Math.sign(dz) * overlapZ;
              velocity.z *= -0.2;
            }
            const impactSpeed = Math.hypot(impactVx, impactVz);
            if (impactSpeed > 3.5) {
              const now = performance.now();
              if (now - lastImpactSound > 150) {
                lastImpactSound = now;
                sfx('impact', Math.min(1, (impactSpeed - 3.5) / 7));
              }
            }
          }

          if (canPass) {
            if (wall.userData.isElectric) {
              levelGroup.remove(wall);
              levelData.walls.splice(i, 1);
              triggerParticles('electric', wPos);
              sfx('boom');
              resetBall();
              showOverlay('⚡ BOOM!', 'Electric wall exploded!', 1.2);
              return;
            }
            else if (wall.userData.isBarrier) {
              triggerParticles('switch', wPos, wall.userData.barrierColor === 'green' ? 0x22ff44 : 0x2244ff);
            }
          }
        }
      }

      // Colour dots: rolling over a dot dyes the ball that colour (never blocks).
      for (const dot of levelData.colorSwitches) {
        const dx = ball.position.x - dot.x;
        const dz = ball.position.z - dot.z;
        if (dx*dx + dz*dz < (0.32 + r) * (0.32 + r)) {
          if (ballColor !== dot.color) {
            ballColor = dot.color;
            const dotHex = dot.color === 'blue' ? 0x2244ff : (dot.color === 'green' ? 0x22ff44 : 0xccccdd);
            ball.material.color.set(dotHex);
            triggerParticles('switch', ball.position, dotHex);
            sfx('pickup');
            // Green is the real Wipeout-style speed burst: a straight-line surge
            // on top of whatever heading you're on, handy at jump pads, after a
            // portal, or to refuse to brake on a boost strip.
            if (dot.color === 'green') {
              greenBoost = CONFIG.greenBoostTime;
              sfx('boost');
            }
          }
        }
      }

      const nowMs = performance.now();
      for (let p of levelData.portals) {
        // After a crossing both portals of the pair stay quiet for 5s, so a
        // player who lingers on the pad isn't bounced straight back.
        const portalCooldownMs = 5000;
        if (nowMs - (p.lastUse || 0) < portalCooldownMs) continue;
        const dx = ball.position.x - p.x;
        const dz = ball.position.z - p.z;
        if (dx*dx + dz*dz < (0.3 + r) * (0.3 + r)) {
          const pair = levelData.portals.filter(q => q.pair === p.pair && q !== p);
          if (pair.length === 1) {
            const dest = pair[0];
            p.lastUse = nowMs; dest.lastUse = nowMs;
            triggerParticles('portal', ball.position, 0x44ff88);
            sfx('portal');
            ball.position.set(dest.x, CONFIG.ballRadius, dest.z);
            velocity.multiplyScalar(0.5);
            // Fairness: free the chasers for a moment after the crossing so a
            // cube can't camp the exit and instantly catch the player on return.
            for (const en of levelData.enemies) if (en.active) en.grace = 2.0;
            // Snap the camera straight to the destination so a crossing feels like
            // stepping across the void, not a slow swing through empty space. Use
            // the rendered (world) position so the tilt-offset ball is centered.
            ball.updateWorldMatrix(true, false);
            const destW = ball.getWorldPosition(new THREE.Vector3());
            const camH = CONFIG.cameraHeight;
            const camF = CONFIG.cameraFollowZ;
            camera.position.set(destW.x, destW.y + camH, destW.z + camF);
            camera.lookAt(destW.x, destW.y, destW.z);
            triggerParticles('portal', ball.position, 0x44ff88);
          }
        }
      }

      updateEnemys(dt);

      const goalDist = Math.hypot(ball.position.x - levelData.goalPos.x, ball.position.z - levelData.goalPos.z);
      if (goalDist < 0.6 && !transitioning) {
        winTimer += dt;
        if (winTimer >= CONFIG.winHoldTime) {
          winTimer = 0;
          sfx('win');
          if (currentLevel < totalLevels) {
            const completed = currentLevel;
            transitioning = true;
            const msg = '🌟 Level ' + completed + ' Complete!';
            const sub = 'Preparing Level ' + (completed + 1) + '…';
            showOverlay(msg, sub, 9999);
            for (let pid in connections) {
              connections[pid].conn.send({ type: 'transition', msg: msg, sub: sub });
            }
            setTimeout(() => {
              currentLevel = completed + 1;
              buildLevel(currentLevel);
              transitioning = false;
              sendLevelData();
              updateHUD();
              hideOverlay();
              if (typeof window.paintHostDots === 'function') window.paintHostDots();
            }, 1200);
          } else {
            showOverlay('🏆 You mastered Tilt Collective!', 'Congratulations, everyone!', 9999);
            gameActive = false;
          }
        }
      } else {
        winTimer = 0;
      }

      ballLight.position.copy(ball.position);
      ballLight.position.y += 0.5;
    }

    function updateCamera() {
      if (!ball) return;
      // The board (and ball) tilt around the world origin, so the RENDERED ball
      // is the rotated world position, not our local physics coordinates. Track
      // the world position so tilting never makes the ball drift toward/away
      // from the lens (which reads as the camera zooming in/out on far islands).
      const ballWorld = ball.getWorldPosition(new THREE.Vector3());
      const h = CONFIG.cameraHeight;
      const fz = CONFIG.cameraFollowZ;
      let cameraTarget;
      if (devMode && !titleGroup.visible) {
        const sn = Math.sin(camYaw), cs = Math.cos(camYaw);
        cameraTarget = new THREE.Vector3(
          ballWorld.x + sn * fz * camDist,
          ballWorld.y + h * camDist + camElev,
          ballWorld.z + cs * fz * camDist
        );
      } else {
        cameraTarget = new THREE.Vector3(
          ballWorld.x,
          ballWorld.y + h,
          ballWorld.z + fz
        );
      }
      camera.position.lerp(cameraTarget, 0.1);
      // While the title is up, frame the ball + title together in the vertical center
      const focusY = titleGroup.visible
        ? (ballWorld.y + CONFIG.ballRadius * 4 + titleGroup.position.y - 1.55) / 2
        : ballWorld.y;
      camera.lookAt(new THREE.Vector3(ballWorld.x, focusY, ballWorld.z));
    }

    // =========================================================================
    // 7.  UI HELPERS & MINIMAP
    // =========================================================================
    const overlay = document.getElementById('ui-overlay');
    const overlayMsg = document.getElementById('overlayMsg');
    const overlaySub = document.getElementById('overlaySub');
    let overlayTimeout = null;

    function showOverlay(msg, sub, duration) {
      overlay.style.display = 'flex';
      overlayMsg.textContent = msg;
      overlaySub.textContent = sub || '';
      if (overlayTimeout) clearTimeout(overlayTimeout);
      if (duration && duration < 9999) {
        overlayTimeout = setTimeout(() => hideOverlay(), duration * 1000);
      }
    }
    function hideOverlay() {
      overlay.style.display = 'none';
      if (overlayTimeout) { clearTimeout(overlayTimeout); overlayTimeout = null; }
    }
    function updateHUD() {
      document.getElementById('levelDisplay').textContent = currentLevel;
    }
    function updateHUDStats(pct) {
      if (!pct) return;
      document.getElementById('pctUp').textContent = pct.up + '%';
      document.getElementById('pctDown').textContent = pct.down + '%';
      document.getElementById('pctLeft').textContent = pct.left + '%';
      document.getElementById('pctRight').textContent = pct.right + '%';
      document.getElementById('statUp').style.width = pct.up + '%';
      document.getElementById('statDown').style.width = pct.down + '%';
      document.getElementById('statLeft').style.width = pct.left + '%';
      document.getElementById('statRight').style.width = pct.right + '%';
      document.getElementById('activeCount').textContent = pct.active;
      const fill = document.getElementById('activityFill');
      fill.style.width = pct.total > 0 ? (pct.active / pct.total * 100) + '%' : '0%';
    }

    function drawMinimap() {
      const w = 150;
      const h = 150;
      minimapCtx.clearRect(0, 0, w, h);

      if (!levelData.goalMesh) return;

      const bound = levelData.viewHalf || (levelData.size / 2) * CONFIG.cellSize;
      const scale = 60 / bound; 

      minimapCtx.fillStyle = "rgba(255,255,255,0.4)";
      for (const wall of levelData.walls) {
        const x = wall.position.x * scale + (w/2);
        const z = wall.position.z * scale + (h/2);
        const s = 3;
        minimapCtx.fillRect(x - s/2, z - s/2, s, s);
      }

      minimapCtx.fillStyle = "#44ff88";
      for (const portal of levelData.portals) {
        minimapCtx.beginPath();
        minimapCtx.arc(portal.x * scale + (w/2), portal.z * scale + (h/2), 2.5, 0, 2 * Math.PI);
        minimapCtx.fill();
      }

      minimapCtx.fillStyle = "#66aaff";
      for (const jp of levelData.jumpPads) {
        minimapCtx.beginPath();
        minimapCtx.arc(jp.x * scale + (w/2), jp.z * scale + (h/2), 2, 0, 2 * Math.PI);
        minimapCtx.fill();
      }
      minimapCtx.fillStyle = "#44ff88";
      for (const bt of levelData.boostTiles) {
        minimapCtx.beginPath();
        minimapCtx.arc(bt.x * scale + (w/2), bt.z * scale + (h/2), 2, 0, 2 * Math.PI);
        minimapCtx.fill();
      }
      minimapCtx.fillStyle = "#88ddee";
      for (const it of levelData.iceTiles) {
        minimapCtx.beginPath();
        minimapCtx.arc(it.x * scale + (w/2), it.z * scale + (h/2), 2, 0, 2 * Math.PI);
        minimapCtx.fill();
      }

      const gx = levelData.goalPos.x * scale + (w/2);
      const gy = levelData.goalPos.z * scale + (h/2);
      minimapCtx.fillStyle = "yellow";
      minimapCtx.beginPath();
      minimapCtx.arc(gx, gy, 4, 0, 2 * Math.PI);
      minimapCtx.fill();

      minimapCtx.fillStyle = "#2244ff";
      for (const dot of levelData.colorSwitches) {
        minimapCtx.beginPath();
        minimapCtx.arc(dot.x * scale + (w/2), dot.z * scale + (h/2), 2, 0, 2 * Math.PI);
        minimapCtx.fill();
      }

      const bx = ball.position.x * scale + (w/2);
      const by = ball.position.z * scale + (h/2);
      minimapCtx.fillStyle = ballColor === 'blue' ? "#2244ff" : (ballColor === 'green' ? "#22ff44" : "purple");
      minimapCtx.beginPath();
      minimapCtx.arc(bx, by, 4, 0, 2 * Math.PI);
      minimapCtx.fill();
    }

    // =========================================================================
    // 8. NETWORKING
    // =========================================================================
    function keyDir(e) {
      const c = e.code || '';
      switch (c) {
        case 'ArrowUp': case 'KeyW': return 'up';
        case 'ArrowDown': case 'KeyS': return 'down';
        case 'ArrowLeft': case 'KeyA': return 'left';
        case 'ArrowRight': case 'KeyD': return 'right';
        default: return '';
      }
    }
    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
    }
    const isHost = new URLSearchParams(window.location.search).get('host') === 'true';
    let peer = null;
    let connections = {};
    let hostKeys = { up: false, down: false, left: false, right: false };
    let gameStarted = false;

    const hostPanel = document.getElementById('ui-host');
    const clientPanel = document.getElementById('ui-client');
    const hostIdDisplay = document.getElementById('hostIdDisplay');
    const clientCountEl = document.getElementById('clientCount');
    const btnStart = document.getElementById('btnStart');
    const peerIdInput = document.getElementById('peerIdInput');
    const connectBtn = document.getElementById('connectBtn');
    const connectionStatus = document.getElementById('connectionStatus');
    const hudPanel = document.getElementById('ui-hud');

    if (isHost) {
      hostPanel.style.display = 'block';
      clientPanel.style.display = 'none';

      function randomGameId() {
        return String(Math.floor(100000 + Math.random() * 900000));
      }
      function initHostPeer() {
        peer = new Peer(randomGameId());
        peer.on('open', (id) => {
          hostIdDisplay.textContent = id;
          connectionStatus.textContent = '✅ Host ready';
        });
        peer.on('error', (err) => {
          console.error('Host peer error:', err);
          if (err.type === 'unavailable-id') {
            peer.destroy();
            setTimeout(initHostPeer, 250);
          } else {
            connectionStatus.textContent = '⚠️ Server problem';
          }
        });
      }
      initHostPeer();

      hostIdDisplay.addEventListener('click', () => {
        const id = hostIdDisplay.textContent;
        if (!id || id.indexOf('connecting') !== -1) return;
        const flash = () => {
          const prev = hostIdDisplay.textContent;
          hostIdDisplay.textContent = '✅ Copied!';
          setTimeout(() => { hostIdDisplay.textContent = prev; }, 1200);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(id).then(flash).catch(() => { fallbackCopy(id); flash(); });
        } else {
          fallbackCopy(id);
          flash();
        }
      });
      peer.on('connection', (conn) => {
        connections[conn.peer] = { conn, keys: { up: false, down: false, left: false, right: false } };
        updateClientCount();
        conn.on('data', (data) => {
          if (data.type === 'keys') {
            if (!connections[conn.peer]) {
              connections[conn.peer] = { conn, keys: { up: false, down: false, left: false, right: false } };
              updateClientCount();
            }
            connections[conn.peer].keys = data.keys;
          }
        });
        conn.on('close', () => {
          delete connections[conn.peer];
          updateClientCount();
        });
      });

      btnStart.addEventListener('click', () => {
        if (gameActive) return;
        ensureAudio();
        gameStarted = true;
        gameActive = true;
        transitioning = false;
        hudPanel.style.display = 'block';
        minimapCanvas.style.display = 'block';
        btnStart.disabled = true;
        btnStart.textContent = '▶ Playing';
        
        // Hide Title screen
        titleGroup.visible = false;
        prepareGameBall();
        
        // Build level and send it
        currentLevel = 1;
        buildLevel(currentLevel);
        sendLevelData();

        updateHUD();
        hideOverlay();
      });

      // Hidden level-selector (testing aid): click the "Host" title 11 times to
      // toggle the level dots. Each dot jumps this session to that level and
      // broadcasts it to every connected client.
      const hostLevels = document.getElementById('hostLevels');
      const hostDots = [];
      for (let i = 1; i <= 30; i++) {
        const d = document.createElement('button');
        d.type = 'button';
        d.className = 'host-dot';
        d.title = 'Jump to level ' + i;
        d.textContent = i;
        d.addEventListener('click', () => {
          if (!gameActive || transitioning) return;
          transitioning = false;
          currentLevel = i;
          buildLevel(currentLevel);
          sendLevelData();
          updateHUD();
          hideOverlay();
          paintHostDots();
        });
        hostLevels.appendChild(d);
        hostDots.push(d);
      }
      function paintHostDots() {
        hostDots.forEach((d, idx) => d.classList.toggle('active', idx + 1 === currentLevel));
      }
      window.paintHostDots = paintHostDots;
      let titleClickCount = 0;
      const hostTitle = document.querySelector('#ui-host .title');
      if (hostTitle) {
        hostTitle.addEventListener('click', () => {
          titleClickCount++;
          if (titleClickCount >= 11) {
            titleClickCount = 0;
            hostLevels.style.display = hostLevels.style.display === 'grid' ? 'none' : 'grid';
            setDevMode(hostLevels.style.display === 'grid');
          }
        });
      }

      function sendLevelData() {
        const data = getLevelDataPacket();
        for (let pid in connections) {
          connections[pid].conn.send(data);
        }
      }

      function updateClientCount() {
        const players = Object.keys(connections).length + 1;
        clientCountEl.textContent = `👥 Players: ${players}`;
        btnStart.disabled = gameActive;
      }

      document.addEventListener('keydown', (e) => {
        if (!gameActive) return;
        const dir = keyDir(e);
        if (!dir) return;
        e.preventDefault();
        hostKeys[dir] = true;
      });
      document.addEventListener('keyup', (e) => {
        const dir = keyDir(e);
        if (!dir) return;
        e.preventDefault();
        hostKeys[dir] = false;
      });

      let lastTime = performance.now();
      let hostStats = null;

      function hostLoop() {
        const now = performance.now();
        const dt = Math.min((now - lastTime) / 1000, 0.05);
        lastTime = now;

        if (gameActive) {
          let up = 0, down = 0, left = 0, right = 0;
          for (let pid in connections) {
            const k = connections[pid].keys;
            if (k.up) up++;
            if (k.down) down++;
            if (k.left) left++;
            if (k.right) right++;
          }
          if (hostKeys.up) up++;
          if (hostKeys.down) down++;
          if (hostKeys.left) left++;
          if (hostKeys.right) right++;
          const totalPlayers = Object.keys(connections).length + 1;
          const total = up + down + left + right;
          const pctUp = total > 0 ? Math.round(up/total*100) : 0;
          const pctDown = total > 0 ? Math.round(down/total*100) : 0;
          const pctLeft = total > 0 ? Math.round(left/total*100) : 0;
          const pctRight = total > 0 ? Math.round(right/total*100) : 0;

          const activeCount = up + down + left + right;
          if (activeCount > 0) {
            const avgX = (right - left) / activeCount;
            const avgZ = (down - up) / activeCount;
            const targetRotX = avgZ * CONFIG.maxTilt;
            const targetRotZ = -avgX * CONFIG.maxTilt;
            currentRotX += (targetRotX - currentRotX) * CONFIG.smoothing;
            currentRotZ += (targetRotZ - currentRotZ) * CONFIG.smoothing;
          } else {
            currentRotX *= 0.95;
            currentRotZ *= 0.95;
          }
          tableGroup.rotation.x = currentRotX;
          tableGroup.rotation.z = currentRotZ;
          physicsUpdate(dt);

          let active = 0;
          for (let pid in connections) {
            const k = connections[pid].keys;
            if (k.up || k.down || k.left || k.right) active++;
          }
          if (hostKeys.up || hostKeys.down || hostKeys.left || hostKeys.right) active++;
          hostStats = { up: pctUp, down: pctDown, left: pctLeft, right: pctRight, active: active, total: totalPlayers };
          updateHUDStats(hostStats);
        }

        // Title faces the camera (yaw only, stays upright), plus clamped mouse rotation/tilt
        if (titleGroup.visible) {
            titleGroup.rotation.y = Math.atan2(
                camera.position.x - titleGroup.position.x,
                camera.position.z - titleGroup.position.z
            ) + titleRotOffset;
            titleGroup.rotation.x = -0.2 + titleTiltOffset;
            ball.rotation.y += 0.015;
        }

        frameCount++;
        if (frameCount % 2 === 0) {
          const ballWorld = new THREE.Vector3();
          ball.getWorldPosition(ballWorld);
          cubeCamera.position.copy(ballWorld);
          const wasVisible = ball.visible;
          ball.visible = false;
          cubeCamera.update(renderer, scene);
          ball.visible = wasVisible;
        }
        particles.update(1/60);

        if (frameCount % 2 === 0) {
          broadcastState();
        }

        renderer.render(scene, camera);
        updateCamera();
        drawMinimap();

        requestAnimationFrame(hostLoop);
      }

      function broadcastState(overrideData = null) {
        let state;
        if (overrideData) {
            state = overrideData;
        } else {
            state = {
              type: 'state',
              ballX: ball.position.x,
              ballY: ball.position.y,
              ballZ: ball.position.z,
              rotX: currentRotX,
              rotZ: currentRotZ,
              level: currentLevel,
              gameActive: gameActive,
              ballColor: ballColor,
              stats: hostStats,
              enemies: levelData.enemies.map(e => ({ x: e.x, z: e.z, active: e.active })),
            };
        }
        for (let pid in connections) {
          connections[pid].conn.send(state);
        }
      }

      hostLoop();

    } else {
      // ---- CLIENT ----
      hostPanel.style.display = 'none';
      clientPanel.style.display = 'flex';
      peerIdInput.focus();

      // Enter in the host-ID box connects (same as clicking Connect)
      peerIdInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          connectBtn.click();
        }
      });

      // SMOOTHING VARIABLES
      let targetPos = new THREE.Vector3(0, CONFIG.ballRadius, 0);
      let enemyTargets = []; // { x, z } per enemy, from host state
      let targetRotX = 0, targetRotZ = 0;

      let clientPeer = new Peer();
      let hostConn = null;
      let connected = false;

      clientPeer.on('open', () => {
        connectionStatus.textContent = '🔗 Enter Host ID';
      });

      connectBtn.addEventListener('click', () => {
        const id = peerIdInput.value.trim();
        if (!id) return;
        if (hostConn) { hostConn.close(); hostConn = null; }
        const conn = clientPeer.connect(id, { reliable: true });
        hostConn = conn;
        conn.on('open', () => {
          connected = true;
          peerIdInput.style.display = 'none';
          connectBtn.style.display = 'none';
          connectionStatus.textContent = '✅ Connected – waiting for host to start…';
          sendKeys();
        });
        conn.on('data', (data) => {
          // --- LEVEL DATA (host started) ---
          if (data.type === 'levelData') {
            currentLevel = data.level;
            buildLevelFromData(data);
            hudPanel.style.display = 'block';
            minimapCanvas.style.display = 'block';
            updateHUD();
            hideOverlay();
            titleGroup.visible = false;
            prepareGameBall();
            connectionStatus.textContent = '✅ Connected – Playing';
          }
          // --- TRANSITION (level complete) ---
          else if (data.type === 'transition') {
            showOverlay(data.msg, data.sub, 9999);
          }
          // --- STATE ---
          else if (data.type === 'state') {
            targetPos.x = data.ballX;
            targetPos.y = data.ballY || CONFIG.ballRadius;
            targetPos.z = data.ballZ;
            targetRotX = data.rotX;
            targetRotZ = data.rotZ;
            if (data.enemies) enemyTargets = data.enemies;
            
            if (data.ballColor) {
              ballColor = data.ballColor;
              if (ballColor === 'blue') ball.material.color.set(0x2244ff);
              else if (ballColor === 'green') ball.material.color.set(0x22ff44);
              else ball.material.color.set(0xccccdd);
            }

            // If host starts game from title and we haven't gotten maze yet
            gameActive = data.gameActive;
            if (data.stats) updateHUDStats(data.stats);
            if (data.gameActive) {
              hudPanel.style.display = 'block';
              minimapCanvas.style.display = 'block';
            }
            if (connected) {
              connectionStatus.textContent = gameActive ? '✅ Connected – Playing' : '✅ Connected – waiting for host to start…';
            }
          }
        });
        conn.on('close', () => {
          connected = false;
          peerIdInput.style.display = '';
          connectBtn.style.display = '';
          peerIdInput.disabled = false;
          connectBtn.disabled = false;
          connectionStatus.textContent = '❌ Disconnected';
        });
      });

      let clientKeys = { up: false, down: false, left: false, right: false };
      function sendKeys() {
        if (connected && hostConn) {
          hostConn.send({ type: 'keys', keys: clientKeys });
        }
      }
      document.addEventListener('keydown', (e) => {
        const dir = keyDir(e);
        if (!dir) return;
        e.preventDefault();
        clientKeys[dir] = true;
        sendKeys();
      });
      document.addEventListener('keyup', (e) => {
        const dir = keyDir(e);
        if (!dir) return;
        e.preventDefault();
        clientKeys[dir] = false;
        sendKeys();
      });

      setInterval(() => { sendKeys(); }, 30);

      function clientRender() {
        frameCount++;
        if (frameCount % 2 === 0) {
          const ballWorld = new THREE.Vector3();
          ball.getWorldPosition(ballWorld);
          cubeCamera.position.copy(ballWorld);
          const wasVisible = ball.visible;
          ball.visible = false;
          cubeCamera.update(renderer, scene);
          ball.visible = wasVisible;
        }
        particles.update(1/60);
        
        // Smoothly interpolate to target position (never during the title screen)
        if (!titleGroup.visible) {
          ball.position.x += (targetPos.x - ball.position.x) * 0.3;
          ball.position.y += (targetPos.y - ball.position.y) * 0.3;
          ball.position.z += (targetPos.z - ball.position.z) * 0.3;
        }

        // Run the SAME enemy chase the host uses, locally toward the (locally
        // interpolated) ball. This drives the cube's activation, flips, pulse
        // and catch — so it chases reliably even in a client tab.
        if (!titleGroup.visible) {
          updateEnemys(1/60);
        }

        // Keep the ball glow following the ball (host does this in physics)
        ballLight.position.copy(ball.position);
        ballLight.position.y = ball.position.y + 0.5;

        currentRotX += (targetRotX - currentRotX) * 0.3;
        currentRotZ += (targetRotZ - currentRotZ) * 0.3;
        tableGroup.rotation.x = currentRotX;
        tableGroup.rotation.z = currentRotZ;

        // Title faces the camera (yaw only, stays upright), plus clamped mouse rotation/tilt
        if (titleGroup.visible) {
            titleGroup.rotation.y = Math.atan2(
                camera.position.x - titleGroup.position.x,
                camera.position.z - titleGroup.position.z
            ) + titleRotOffset;
            titleGroup.rotation.x = -0.2 + titleTiltOffset;
            ball.rotation.y += 0.015;
        }

        renderer.render(scene, camera);
        updateCamera();
        drawMinimap();

        requestAnimationFrame(clientRender);
      }
      
      clientRender();

      currentLevel = 1;
      updateHUD(); 
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    updateCamera();
    console.log('Tilt Collective loaded.');
  </script>
</body>
